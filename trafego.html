<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 Tráfego — Reparo Eletro</title>
<script>
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  var _f=window.fetch;
  window.fetch=function(u,o){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        var kk=localStorage.getItem('tf_key')||'';
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(kk);
      }
    }catch(e){}
    return _f.call(this,u,o);
  };
})();
</script>
<style>
:root{
  --bg:#07080a; --painel:#101319; --linha:#1e232c; --txt:#f0f2f5; --dim:#79828f;
  --campeao:#22c55e; --atencao:#f59e0b; --ralo:#ef4444;
  --tv:#3b82f6; --microondas:#f97316; --purificador:#06b6d4; --adega:#a855f7; --forno:#ef4444; --institucional:#14b8a6; --outros:#64748b;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:14px;max-width:840px;margin:0 auto;padding-bottom:70px;-webkit-font-smoothing:antialiased;}
h1{font-size:17px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:7px;}
.sub{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px;}

/* ── termômetro da semana ── */
.termo{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 12px;}
.verba{background:var(--painel);border:1px solid var(--linha);border-radius:13px;padding:12px;}
.verba .rot{font-size:9.5px;font-weight:900;color:var(--dim);letter-spacing:.7px;}
.verba .val{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;margin-top:3px;}
.verba .det{font-size:10px;color:var(--dim);margin-top:3px;font-family:var(--mono);}
.barra{height:5px;background:#191d25;border-radius:99px;margin-top:8px;overflow:hidden;}
.barra i{display:block;height:100%;border-radius:99px;transition:width .5s ease;}

/* ── abas de categoria ── */
.abas{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:3px;margin-bottom:12px;}
.aba{flex:0 0 auto;background:var(--painel);border:1px solid var(--linha);border-radius:99px;padding:7px 13px;
  font-size:11.5px;font-weight:800;color:var(--dim);cursor:pointer;white-space:nowrap;}
.aba.on{color:#fff;}
.aba b{font-family:var(--mono);font-size:10.5px;opacity:.85;margin-left:4px;}

/* ── cartão do anúncio ── */
.ad{background:var(--painel);border:1px solid var(--linha);border-left-width:3px;border-radius:12px;
  padding:11px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;}
.ad.campeao{border-left-color:var(--campeao);}
.ad.atencao{border-left-color:var(--atencao);}
.ad.ralo{border-left-color:var(--ralo);}
.ad.sem-dados{border-left-color:#2c333f;}
.ad.pausado{opacity:.45;}
.thumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:#161a21;flex:0 0 auto;}
.thumb.vazio{display:flex;align-items:center;justify-content:center;font-size:19px;color:#3a424f;}
.corpo{flex:1;min-width:0;}
.nome{font-size:12.5px;font-weight:800;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cpa-linha{display:flex;align-items:baseline;gap:6px;margin-top:5px;}
.cpa{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1;}
.cpa-rot{font-size:9.5px;color:var(--dim);font-weight:800;}

/* ── SIGNATURE: régua de meta ── */
/* a meta da categoria é a linha fixa no meio; o marcador cai à esquerda (lucro) ou à direita (ralo) */
.regua{position:relative;height:16px;margin-top:8px;}
.trilho{position:absolute;top:7px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,rgba(34,197,94,.55) 0%,rgba(34,197,94,.55) 48%,#3b4250 48%,#3b4250 52%,rgba(239,68,68,.5) 52%,rgba(239,68,68,.5) 100%);border-radius:99px;}
.meta-tick{position:absolute;left:50%;top:1px;width:2px;height:14px;background:#8b93a3;border-radius:2px;transform:translateX(-50%);}
.meta-lbl{position:absolute;left:50%;top:-1px;transform:translateX(6px);font-family:var(--mono);font-size:8.5px;color:var(--dim);font-weight:700;}
.marcador{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);transform:translateX(-50%);transition:left .5s ease;}
.metricas{display:flex;gap:11px;margin-top:7px;flex-wrap:wrap;}
.metricas span{font-family:var(--mono);font-size:10px;color:var(--dim);}
.metricas b{color:#aeb6c2;font-weight:700;}
.tag{display:inline-block;font-size:8.5px;font-weight:900;padding:2px 6px;border-radius:5px;margin-left:5px;vertical-align:1px;}

.vazio-msg{text-align:center;color:var(--dim);padding:34px 16px;font-size:12.5px;line-height:1.6;}
.rodape{position:fixed;bottom:0;left:0;right:0;background:rgba(7,8,10,.93);backdrop-filter:blur(9px);
  border-top:1px solid var(--linha);padding:9px 14px;display:flex;gap:8px;justify-content:center;align-items:center;}
.btn{background:var(--painel);border:1px solid var(--linha);border-radius:9px;padding:8px 14px;
  color:var(--txt);font-size:11.5px;font-weight:800;cursor:pointer;}
.btn.destaque{background:#1d4ed8;border-color:#2563eb;}
a.voltar{color:var(--dim);text-decoration:none;font-size:11.5px;font-weight:700;}
</style>
</head>
<body>
<h1>📈 Tráfego <span id="atualizado" style="font-size:10px;color:var(--dim);font-weight:600;"></span></h1>
<div class="sub" id="ciclo">carregando o ciclo…</div>

<div class="abas" id="periodos" style="margin:12px 0 10px;">
  <div class="aba" data-p="hoje" onclick="setPeriodo('hoje')">Hoje</div>
  <div class="aba" data-p="7d" onclick="setPeriodo('7d')">Últimos 7 dias</div>
  <div class="aba on" data-p="ciclo" onclick="setPeriodo('ciclo')" style="border-color:#f97316;background:#f9731622;color:#fff;">Ciclo da semana</div>
</div>
<div id="totais"></div>
<div class="termo" id="termo"></div>
<div class="abas" id="secoes" style="margin-bottom:10px;">
  <div class="aba on" id="s-anuncios" onclick="secao('anuncios')" style="border-color:#f97316;background:#f9731622;color:#fff;">📊 Anúncios ativos</div>
  <div class="aba" id="s-copiloto" onclick="secao('copiloto')">🧭 Copiloto</div>
  <div class="aba" id="s-analise" onclick="secao('analise')">🔬 Análise &amp; criativos</div>
  <div class="aba" id="s-inteligencia" onclick="secao('inteligencia')">🧠 Inteligência</div>
  <div class="aba" id="s-programacao" onclick="secao('programacao')">📅 Programação</div>
</div>
<div id="pg-anuncios">
  <div id="recado-copiloto"></div>
  <div class="abas" id="abas"></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
    <label style="font-size:10.5px;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;">
      <input type="checkbox" id="ver-pausados" onchange="carregar(true)"> incluir pausados
    </label>
  </div>
  <div id="lista"><div class="vazio-msg">⏳ Puxando os anúncios da Meta…</div></div>
</div>
<div id="pg-copiloto" style="display:none;"></div>
<div id="pg-analise" style="display:none;"></div>
<div id="pg-inteligencia" style="display:none;"></div>
<div id="pg-programacao" style="display:none;"></div>

<div class="rodape">
  <a class="voltar" href="/adm">← Menu</a>
  <button class="btn" onclick="carregar(true)">🔄 Atualizar agora</button>
</div>

<script>
var CAT_NOME={tv:'TV',microondas:'Micro-ondas',forno:'Forno elétrico',purificador:'Purificador',adega:'Adega',institucional:'Institucional',outros:'Outros'};
var _d=null,_cat='todos',_per='ciclo';
function setPeriodo(p){
  _per=p;
  Array.prototype.forEach.call(document.querySelectorAll('#periodos .aba'),function(t){
    var on=t.getAttribute('data-p')===p;
    t.classList.toggle('on',on);
    t.style.borderColor=on?'#f97316':'';t.style.background=on?'#f9731622':'';t.style.color=on?'#fff':'';
  });
  document.getElementById('lista').innerHTML='<div class="vazio-msg">⏳ Carregando '+(p==='hoje'?'hoje':p==='7d'?'os últimos 7 dias':'o ciclo')+'…</div>';
  carregar();
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function corCat(c){return getComputedStyle(document.documentElement).getPropertyValue('--'+c).trim()||'#64748b';}
function corSit(s){return s==='campeao'?'#22c55e':s==='atencao'?'#f59e0b':s==='ralo'?'#ef4444':'#4b5563';}

async function carregar(forcar){
  try{
    var vp=document.getElementById('ver-pausados');
    var r=await fetch('/api/trafego?action=painel&periodo='+_per+(forcar?'&forcar=1':'')+((vp&&vp.checked)?'&todos=1':'')).then(function(x){return x.json();});
    if(!r.ok){
      document.getElementById('lista').innerHTML='<div class="vazio-msg">Não consegui ler a conta de anúncios.<br><span style="font-size:11px;color:#fca5a5;">'+esc(r.erro||r.error||'')+'</span><br><br><button class="btn" onclick="carregar(true)">tentar de novo</button></div>';
      return;
    }
    _d=r;render();
  }catch(e){
    document.getElementById('lista').innerHTML='<div class="vazio-msg">Falha de conexão com o painel.</div>';
  }
}

function render(){
  var v=_d.verba;
  document.getElementById('ciclo').textContent=(_d.periodoLabel||'')+' · '+(_d.exibidos!=null?_d.exibidos:_d.totalAnuncios)+' anúncios rodando agora';
  document.getElementById('atualizado').textContent=_d.doCache?'· cache de '+new Date(_d.cacheDe).toLocaleTimeString('pt-BR').slice(0,5):'· agora';

  var t=_d.totais||{};
  document.getElementById('totais').innerHTML=
    '<div style="background:var(--painel);border:1px solid var(--linha);border-radius:13px;padding:12px;margin-bottom:10px;">'
    +'<div style="font-size:9.5px;font-weight:900;color:var(--dim);letter-spacing:.7px;">'+esc((_d.periodoLabel||'').toUpperCase())+'</div>'
    +'<div style="display:flex;gap:18px;margin-top:7px;align-items:baseline;flex-wrap:wrap;">'
      +'<div><div style="font-family:var(--mono);font-size:20px;font-weight:700;">'+brl(t.gasto)+'</div><div style="font-size:9.5px;color:var(--dim);font-weight:700;">VALOR USADO</div></div>'
      +'<div><div style="font-family:var(--mono);font-size:20px;font-weight:700;">'+(t.conversas||0)+'</div><div style="font-size:9.5px;color:var(--dim);font-weight:700;">CONVERSAS INICIADAS</div></div>'
      +'<div><div style="font-family:var(--mono);font-size:20px;font-weight:700;color:#fb923c;">'+(t.cpa!=null?brl(t.cpa):'—')+'</div><div style="font-size:9.5px;color:var(--dim);font-weight:700;">POR CONVERSA</div></div>'
    +'</div>'
    +'<div style="font-size:9.5px;color:#5a6270;margin-top:8px;line-height:1.5;">'+esc((_d.calculo||{}).formula||'')
      +'<br>métrica da Meta: <span style="font-family:var(--mono);">'+esc((_d.calculo||{}).metricaMeta||'')+'</span></div>'
  +'</div>';
  document.getElementById('termo').innerHTML=[['ADM',v.adm,'#f97316'],['TV',v.tv,'#3b82f6']].map(function(p){
    var nome=p[0],d=p[1],cor=p[2];
    var pct=d.real>0?Math.min(100,d.gasto/d.real*100):0;
    return '<div class="verba">'
      +'<div class="rot" style="color:'+cor+';">VERBA '+nome+'</div>'
      +'<div class="val">'+brl(d.saldo)+'</div>'
      +'<div class="det">disponível de '+brl(d.real)+'</div>'
      +'<div class="barra"><i style="width:'+pct.toFixed(1)+'%;background:'+cor+';"></i></div>'
      +'<div class="det" style="margin-top:5px;">gasto '+brl(d.gasto)+' · '+pct.toFixed(0)+'%</div>'
    +'</div>';
  }).join('');

  var cats=['todos','tv','microondas','purificador','adega','outros'];
  document.getElementById('abas').innerHTML=cats.map(function(c){
    if(c!=='todos'&&(!_d.porCategoria[c]||!_d.porCategoria[c].anuncios))return '';
    var pc=_d.porCategoria[c];
    var rot=c==='todos'?'Todos':CAT_NOME[c];
    var n=c==='todos'?(_d.ativos||0):pc.anuncios;
    var cor=c==='todos'?'#8b93a3':corCat(c);
    return '<div class="aba'+(_cat===c?' on':'')+'" onclick="_cat=\''+c+'\';render();" '
      +'style="'+(_cat===c?'border-color:'+cor+';background:'+cor+'22;':'')+'">'
      +esc(rot)+'<b>'+n+'</b></div>';
  }).join('');

  var lista=_d.anuncios.filter(function(a){return _cat==='todos'||a.categoria===_cat;});
  var el=document.getElementById('lista');
  if(!lista.length){el.innerHTML='<div class="vazio-msg">Nenhum anúncio nesta categoria ainda.</div>';return;}

  var resumo='';
  if(_cat!=='todos'){
    var pc=_d.porCategoria[_cat];
    resumo='<div style="background:var(--painel);border:1px solid var(--linha);border-radius:11px;padding:10px 12px;margin-bottom:11px;">'
      +'<div style="font-size:10px;color:var(--dim);font-weight:800;">'+esc(CAT_NOME[_cat]).toUpperCase()+' · META '+brl(pc.meta)+' POR CONVERSA</div>'
      +'<div style="display:flex;gap:16px;margin-top:6px;font-family:var(--mono);font-size:12px;">'
        +'<span>CPA <b style="color:'+(pc.cpa!=null&&pc.cpa<=pc.meta?'#22c55e':'#ef4444')+';font-size:15px;">'+(pc.cpa!=null?brl(pc.cpa):'—')+'</b></span>'
        +'<span style="color:var(--dim);">'+pc.conversas+' conversas</span>'
        +'<span style="color:var(--dim);">'+brl(pc.gasto)+'</span>'
      +'</div>'
      +'<div style="font-size:10.5px;color:var(--dim);margin-top:5px;">🟢 '+pc.campeoes+' no alvo · 🔴 '+pc.ralos+' acima da meta</div>'
    +'</div>';
  }

  el.innerHTML=resumo+lista.map(function(a){
    // régua: meta fica em 50%. razão 0 → 4% ; razão 1 → 50% ; razão 2+ → 96%
    var pos=a.razaoMeta==null?null:Math.max(4,Math.min(96,a.razaoMeta<=1?4+a.razaoMeta*46:50+Math.min(46,(a.razaoMeta-1)*46)));
    var cor=corSit(a.situacao);
    return '<div class="ad '+a.situacao+(a.ativo?'':' pausado')+'">'
      +(a.thumb?'<img class="thumb" src="'+esc(a.thumb)+'" alt="" loading="lazy">':'<div class="thumb vazio">🎬</div>')
      +'<div class="corpo">'
        +'<div class="nome">'+esc(a.nome)
          +(a.ativo?'':'<span class="tag" style="background:#242a34;color:#8b93a3;">PAUSADO</span>')
          +'<span class="tag" style="background:'+corCat(a.categoria)+'22;color:'+corCat(a.categoria)+';">'+esc(CAT_NOME[a.categoria]||'—')+'</span>'
        +'</div>'
        +'<div class="cpa-linha">'
          +'<span class="cpa" style="color:'+cor+';">'+(a.cpa!=null?brl(a.cpa):(a.gasto>0?'sem conversa':'—'))+'</span>'
          +'<span class="cpa-rot">POR CONVERSA</span>'
        +'</div>'
        +(pos!=null?'<div class="regua"><div class="trilho"></div><div class="meta-tick"></div>'
          +'<div class="meta-lbl">meta '+brl(a.meta).replace('R$ ','R$')+'</div>'
          +'<div class="marcador" style="left:'+pos+'%;background:'+cor+';"></div></div>':'')
        +'<div class="metricas">'
          +'<span>💬 <b>'+a.conversas+'</b></span>'
          +'<span>💸 <b>'+brl(a.gasto)+'</b></span>'
          +(a.orcamentoDiario!=null?'<span>📅 <b>'+brl(a.orcamentoDiario)+'</b>/dia</span>':'')
          +(a.ctr!=null?'<span>CTR <b>'+a.ctr+'%</b></span>':'')
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

function secao(s){
  ['anuncios','copiloto','analise','inteligencia','programacao'].forEach(function(x){
    document.getElementById('pg-'+x).style.display=x===s?'block':'none';
    var t=document.getElementById('s-'+x);
    if(x===s){t.classList.add('on');t.style.borderColor='#f97316';t.style.background='#f9731622';t.style.color='#fff';}
    else{t.classList.remove('on');t.style.borderColor='';t.style.background='';t.style.color='';}
  });
  if(s==='copiloto'&&!window._cop)carregarCopiloto();
  if(s==='analise'&&!window._an)carregarAnalise(false);
  if(s==='inteligencia'&&!window._int)carregarInteligencia(false);
  if(s==='programacao')carregarProgramacao();
}

/* ── 📅 PROGRAMAÇÃO DO PRÓXIMO CICLO ── */
async function carregarProgramacao(){
  var el=document.getElementById('pg-programacao');
  el.innerHTML='<div class="vazio-msg">📅 Montando o plano do próximo ciclo…</div>';
  var r=await fetch('/api/trafego?action=montar-semana',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({})}).then(function(x){return x.json();}).catch(function(){return null;});
  if(!r||!r.ok){el.innerHTML='<div class="vazio-msg">'+esc((r&&r.error)||'não consegui montar o plano')+'</div>';return;}
  window._prog=r;
  var dIni=new Date(r.inicio), dFim=new Date(r.fim);
  var fmt=function(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};

  var h='<div style="background:linear-gradient(150deg,rgba(59,130,246,.12),rgba(13,16,24,.95));border:1px solid rgba(59,130,246,.45);border-radius:13px;padding:13px;margin-bottom:12px;">'
    +'<div style="font-size:9.5px;font-weight:900;color:#60a5fa;letter-spacing:.6px;">PRÓXIMO CICLO</div>'
    +'<div style="font-family:var(--mono);font-size:13px;font-weight:700;margin-top:5px;">'+fmt(dIni)+' → '+fmt(dFim)+'</div>'
    +'<div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;">'
      +'<div><div style="font-family:var(--mono);font-size:20px;font-weight:700;">'+r.total+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">ANÚNCIOS</div></div>'
      +'<div><div style="font-family:var(--mono);font-size:20px;font-weight:700;color:#fb923c;">'+brl(r.verbaPorAnuncio.adm)+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">CADA (ADM · '+r.adm+')</div></div>'
      +'<div><div style="font-family:var(--mono);font-size:20px;font-weight:700;color:#60a5fa;">'+brl(r.verbaPorAnuncio.tv)+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">CADA (TV · '+r.tv+')</div></div>'
    +'</div>'
    +'<div style="font-size:10.5px;color:#93c5fd;margin-top:9px;line-height:1.5;">✅ '+esc(r.observacao||'')+'</div>'
  +'</div>';

  if(!r.itens.length){
    h+='<div class="vazio-msg">Nenhum criativo registrado ainda para o próximo ciclo.<br><span style="font-size:11px;">Suba os vídeos nas pastas do Drive e peça para registrar.</span></div>';
    el.innerHTML=h;return;
  }

  // agrupa por categoria
  var porCat={};
  r.itens.forEach(function(s){
    var p=s.split(' | ');
    var cat=(p[0]||'').toLowerCase();
    (porCat[cat]=porCat[cat]||[]).push({tipo:(p[1]||'').trim(),nome:(p[2]||'').trim(),verba:(p[3]||'').trim(),modelo:(p[4]||'').trim()});
  });
  h+=Object.keys(porCat).map(function(cat){
    var cor=corCat(cat);
    var itens=porCat[cat];
    return '<div style="background:var(--painel);border:1px solid var(--linha);border-left:4px solid '+cor+';border-radius:13px;padding:13px;margin-bottom:11px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;">'
        +'<b style="font-size:15px;color:'+cor+';">'+esc(CAT_NOME[cat]||cat)+'</b>'
        +'<span style="font-family:var(--mono);font-size:11px;color:var(--dim);">'+itens.length+' anúncios</span></div>'
      +itens.map(function(i){
        var ehCampeao=(i.tipo==='mantido'||i.tipo==='campeao');

async function carregarRoas(recalcular){
  var d=window._roasDias||56;
  var r=await fetch('/api/trafego?action=roas&dias='+d+(recalcular?'&gerar=1':'')).then(function(x){return x.json();}).catch(function(){return null;});
  if(!r||!r.ok){window._roasHtml='';return null;}

  var seletor='<div class="abas" style="margin-bottom:10px;">'
    +[[30,'30 dias'],[56,'8 semanas'],[90,'90 dias']].map(function(p){
      var on=d===p[0];
      return '<div class="aba'+(on?' on':'')+'" onclick="setRoasDias('+p[0]+')" style="'+(on?'border-color:#22c55e;background:#22c55e22;color:#fff;':'')+'">'+p[1]+'</div>';
    }).join('')+'</div>';

  var painel=function(titulo,dados,cor,cats){
    if(!dados||(!dados.investido&&!dados.faturado))return '';

      .sort(function(a,b){return (b.roas||0)-(a.roas||0);});
    var maxR=Math.max.apply(null,bars.map(function(l){return l.roas||0;}).concat([1]));
    return '<div style="background:linear-gradient(150deg,'+cor+'1a,rgba(13,16,24,.95));border:1px solid '+cor+'66;border-radius:13px;padding:13px;margin-bottom:10px;">'
      +'<div style="font-size:9.5px;font-weight:900;color:'+cor+';letter-spacing:.6px;">'+titulo+'</div>'
      +'<div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;align-items:baseline;">'
        +'<div><div style="font-family:var(--mono);font-size:24px;font-weight:700;color:'+cor+';">'+(dados.roas!=null?dados.roas.toFixed(2)+'x':'—')+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">ROAS</div></div>'
        +'<div><div style="font-family:var(--mono);font-size:15px;font-weight:700;">'+brl(dados.faturado)+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">FATURADO</div></div>'
        +'<div><div style="font-family:var(--mono);font-size:15px;font-weight:700;color:#8b93a3;">'+brl(dados.investido)+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">INVESTIDO</div></div>'
        +'<div><div style="font-family:var(--mono);font-size:15px;font-weight:700;color:#8b93a3;">'+dados.vendas+'</div><div style="font-size:9px;color:var(--dim);font-weight:800;">VENDAS</div></div>'
      +'</div>'
      +(bars.length>1?'<div style="margin-top:11px;">'+bars.map(function(l){
        var c2=corCat(l.categoria);
        var larg=l.roas?Math.max(4,(l.roas/maxR)*100):0;
        return '<div style="margin-bottom:8px;">'
          +'<div style="display:flex;justify-content:space-between;font-size:11px;">'
            +'<span style="font-weight:800;color:'+c2+';">'+esc(CAT_NOME[l.categoria]||l.categoria)+'</span>'
            +'<span style="font-family:var(--mono);font-weight:700;">'+(l.roas!=null?l.roas.toFixed(2)+'x':'—')+'</span></div>'
          +'<div style="height:5px;background:#161a21;border-radius:99px;margin-top:3px;overflow:hidden;"><div style="height:100%;width:'+larg+'%;background:'+c2+';"></div></div>'
          +'<div style="font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px;">'+brl(l.investido)+' → '+brl(l.faturado)+' · '+l.vendas+' vendas · ticket '+(l.ticketMedio?brl(l.ticketMedio):'—')+'</div>'
        +'</div>';}).join('')+'</div>':'')

  };

  return r;

async function aplicarCopiloto(){
  var r=window._cop;if(!r)return;
  var pausar=[],orcs=[];
  (r.planos||[]).forEach(function(p){
    p.cortar.forEach(function(c){pausar.push({id:c.id,adsetId:c.adsetId,campanhaId:c.campanhaId,nome:c.nome});});
    p.reforcar.forEach(function(d){
      if(d.receber<=0)return;
      var alvo=d.alvoId||d.adsetId;
      if(!alvo)return;
      if(d.campoVerba==='lifetime_budget'&&d.verbaNova){
        orcs.push({alvoId:alvo,campo:'lifetime_budget',valor:d.verbaNova});
      }else if(d.diarioNovo){
        orcs.push({alvoId:alvo,campo:'daily_budget',valor:d.diarioNovo});
      }
    });
  });
  var ov=document.getElementById('ov-revisao'); if(ov)ov.remove();
  var el=document.getElementById('pg-copiloto');
  el.innerHTML='<div class="vazio-msg">▶️ Aplicando na Meta…</div>';
  var resp=await fetch('/api/trafego?action=aplicar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({confirmar:true,pausarIds:pausar,orcamentos:orcs})
  }).then(function(x){return x.json();}).catch(function(){return{ok:false,erros:[{erro:'falha de rede'}]};});
  var h='<div style="background:var(--painel);border:1px solid var(--linha);border-radius:13px;padding:14px;">'
    +'<div style="font-size:14px;font-weight:900;color:'+(resp.ok?'#4ade80':'#f59e0b')+';">'+(resp.ok?'✅ Aplicado':'⚠️ Aplicado com pendências')+'</div>'
    +'<div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px;">'+(resp.feitos||[]).length+' alteração(ões) confirmada(s)</div>'
    +((resp.erros||[]).length?'<div style="margin-top:8px;font-size:11px;color:#fca5a5;line-height:1.5;">'
      +resp.erros.slice(0,8).map(function(e){return '• '+esc(e.acao)+': '+esc(e.erro)+(e.codigo?' (cód '+e.codigo+')':'');}).join('<br>')
      +((resp.erros||[]).length>8?'<br>… e mais '+(resp.erros.length-8):'')+'</div>':'')
  +'</div>';
  el.innerHTML=h;
  window._cop=null;
  setTimeout(function(){carregar(true);},1500);
}

    var cor=corCat(s.categoria||'outros');
    return '<div style="background:var(--painel);border:1px solid var(--linha);border-left:3px solid '+cor+';border-radius:12px;padding:12px;margin-bottom:9px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
        +'<div style="font-size:13px;font-weight:900;line-height:1.3;">'+esc(s.titulo||'')+'</div>'
        +'<span class="tag" style="background:'+cor+'22;color:'+cor+';flex:0 0 auto;">'+esc(CATS_SUG[s.categoria]||s.categoria||'')+'</span>'
      +'</div>'
      +'<div style="margin-top:7px;font-size:12px;line-height:1.5;color:#dbe1ea;"><b style="color:'+cor+';">Gancho:</b> '+esc(s.gancho||'')+'</div>'
      +((s.roteiro||[]).length?'<div style="margin-top:7px;font-size:11.5px;color:var(--dim);line-height:1.6;">'+s.roteiro.map(function(c,ix){return '<div><b style="color:#aeb6c2;font-family:var(--mono);">'+(ix+1)+'.</b> '+esc(c)+'</div>';}).join('')+'</div>':'')
      +(s.legenda?'<div style="margin-top:8px;background:#0c1016;border:1px solid var(--linha);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;">'+esc(s.legenda)+'</div>':'')
      +'<div style="margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;">'
        +'<span style="font-size:10.5px;color:#4ade80;font-weight:800;">→ '+esc(s.cta||'')+'</span>'
        +'<button class="btn" style="padding:4px 9px;font-size:10px;" onclick="copiarSug('+i+')">copiar</button>'
      +'</div>'
      +(s.porque?'<div style="margin-top:6px;font-size:10.5px;color:var(--dim);font-style:italic;">'+esc(s.porque)+'</div>':'')
    +'</div>';
  }).join('');
  h+='<div style="font-size:10px;color:var(--dim);text-align:center;margin-top:10px;">gerado em '+(r.geradoEm?new Date(r.geradoEm).toLocaleString('pt-BR').slice(0,16):'—')+' · base: '+((r.baseadoEm||{}).campeoes||0)+' campeões</div>';
  el.innerHTML=h;
}
function copiarSug(i){
  var s=(window._an&&window._an.sugestoes||[])[i];if(!s)return;
  var txt=s.titulo+'\n\nGANCHO: '+s.gancho+'\n\nROTEIRO:\n'+(s.roteiro||[]).map(function(c,ix){return (ix+1)+'. '+c;}).join('\n')+'\n\nLEGENDA:\n'+s.legenda+'\n\nCTA: '+s.cta;
  if(navigator.clipboard)navigator.clipboard.writeText(txt);
}

/* ── 📰 RECADO DIÁRIO DO COPILOTO ── */
async function carregarRecado(){
  var el=document.getElementById('recado-copiloto');
  if(!el)return;
  var r=await fetch('/api/trafego?action=relatorio-diario').then(function(x){return x.json();}).catch(function(){return null;});
  if(!r||!r.ok||!r.mensagem){
    el.innerHTML='<div style="background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:11px 13px;margin-bottom:11px;font-size:11.5px;color:var(--dim);">'
      +'🧭 O copiloto ainda não gerou o recado de hoje. <a href="#" onclick="gerarRecado();return false;" style="color:#60a5fa;">gerar agora</a></div>';
    return;
  }
  var t=r.totais||{};
  var listinha=function(tit,arr,cor,sinal){
    if(!arr||!arr.length)return '';
    return '<div style="margin-top:8px;"><div style="font-size:9.5px;font-weight:900;color:'+cor+';letter-spacing:.4px;">'+tit+'</div>'
      +arr.slice(0,4).map(function(x){
        return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:3px;">'
          +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(x.nome)+'</span>'
          +'<span style="font-family:var(--mono);color:'+cor+';flex:0 0 auto;">'+(x.cpa!=null?brl(x.cpa):'sem conversa')
          +(x.variacaoPct!=null?' <b>'+sinal+Math.abs(x.variacaoPct)+'%</b>':'')+'</span></div>';
      }).join('')+'</div>';
  };
  el.innerHTML='<div style="background:linear-gradient(150deg,rgba(59,130,246,.12),rgba(13,16,24,.95));border:1px solid rgba(59,130,246,.4);border-radius:13px;padding:13px;margin-bottom:11px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;">'
      +'<div style="font-size:9.5px;font-weight:900;color:#60a5fa;letter-spacing:.6px;">🧭 RECADO DO COPILOTO · '+(r.dia||'').split("-").reverse().join("/")+'</div>'
      +'<a href="#" onclick="gerarRecado();return false;" style="font-size:10px;color:var(--dim);text-decoration:none;">↻</a>'
    +'</div>'
    +'<div style="font-size:12.5px;line-height:1.6;margin-top:8px;">'+esc(r.mensagem)+'</div>'
    +'<div style="font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:8px;">'
      +brl(t.gasto)+' · '+t.conversas+' conversas · '+(t.cpa!=null?brl(t.cpa)+'/conversa':'—')
      +' · '+r.estaveis+' estáveis · '+r.diasDeHistorico+' dias de histórico</div>'
    +listinha('📈 MELHORANDO',r.melhorando,'#4ade80','−')
    +listinha('📉 PIORANDO',r.piorando,'#f87171','+')
    +((r.semConversa||[]).length?listinha('⚠️ SEM CONVERSA ONTEM',r.semConversa,'#f59e0b',''):'')
  +'</div>';
}
async function gerarRecado(){
  var el=document.getElementById('recado-copiloto');
  if(el)el.innerHTML='<div style="background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:11px 13px;margin-bottom:11px;font-size:11.5px;color:var(--dim);">🧭 Analisando o dia…</div>';
  await fetch('/api/trafego?action=relatorio-diario&gerar=1').catch(function(){});
  carregarRecado();
}

carregarRecado();
carregar();
setInterval(function(){if(!document.hidden)carregar();},30*60*1000);
</script>
