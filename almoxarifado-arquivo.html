<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦🔎 Almoxarifado — Arquivo</title>
<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  if(localStorage.getItem('tf_role')==='tv'&&location.pathname.indexOf('/tv')!==0){
    location.replace('/tv-adm');return;
  }
  var _f=window.fetch;
  window.fetch=function(u,o){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        o=o||{};
        var kk=localStorage.getItem('tf_key')||'';
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(kk);
      }
    }catch(e){}
    return _f.call(this,u,o);
  };
})();
</script>
<style>
:root{--bg:#0e1013;--surface:#16191e;--line:#262b33;--txt:#f0f2f5;--dim:#8b93a3;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px;max-width:760px;margin:0 auto;}
h1{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
h1 a{color:var(--dim);text-decoration:none;font-size:13px;font-weight:700;margin-left:auto;}
.busca{display:flex;gap:8px;margin-bottom:14px;}
.busca input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:14px;outline:none;}
.busca button{background:#f59e0b;border:none;border-radius:10px;padding:12px 18px;color:#111;font-weight:900;font-size:14px;cursor:pointer;}
.sec{font-size:11px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;}
.card.feito{border-left:4px solid #22c55e;}
.card.falha{border-left:4px solid #ef4444;}
.card.pend{border-left:4px solid #f59e0b;}
.nm{font-size:14px;font-weight:800;}
.meta{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5;}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:8px;background:rgba(245,158,11,.15);color:#f59e0b;margin-right:5px;}
.empty{text-align:center;color:var(--dim);padding:40px 16px;font-size:13.5px;}
a.foto{color:#60a5fa;text-decoration:none;}
</style>
</head>
<body>
<h1>📦🔎 Almoxarifado — Arquivo <a href="/almoxarifado">← voltar</a></h1>
<div class="busca">
  <input id="q" placeholder="Nome, telefone, equipamento, modelo, OS, motorista..." onkeydown="if(event.key==='Enter')buscar()">
  <button onclick="buscar()">Buscar</button>
</div>
<div id="res"><div class="empty">Digite e busque — ou clique em Buscar vazio para ver os últimos registros</div></div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtD(iso){if(!iso)return'—';var d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
var TIPOS={receber:'📥 Recebimento',mover:'📦 Movimentação','loja-reprovado':'🔴 Loja Reprovado',venda:'💰 Venda','avaliar-compra':'🧐 Avaliação de Compra','levar-area':'📦 Equip. Comprado'};
async function buscar(){
  var q=document.getElementById('q').value.trim();
  var el=document.getElementById('res');
  el.innerHTML='<div class="empty">Buscando…</div>';
  try{
    var r=await fetch('/api/almoxarifado?action=arquivo&q='+encodeURIComponent(q)).then(function(x){return x.json();});
    if(!r.ok){el.innerHTML='<div class="empty">Erro na busca</div>';return;}
    var html='';
    if(r.tarefas.length){
      html+='<div class="sec">📋 Tarefas ('+r.tarefas.length+')</div>';
      html+=r.tarefas.map(function(t){
        var cls=t.status==='feito'?'feito':t.status==='falha'?'falha':'pend';
        var st=t.status==='feito'?'✅ Concluída':t.status==='falha'?'⚠️ '+esc(t.motivoFalha||'falha'):'⏳ Pendente';
        return '<div class="card '+cls+'"><span class="tag">'+(TIPOS[t.tipo]||t.tipo)+'</span><span class="nm">'+esc(t.cliente||'—')+'</span>'+
          '<div class="meta">'+esc(t.equipamento||'—')+(t.modelo?' · Modelo: <b>'+esc(t.modelo)+'</b>':'')+(t.tel?' · 📞 '+esc(t.tel):'')+'<br>'+
          st+(t.feitoPor?' · '+esc(t.feitoPor):'')+' · '+fmtD(t.feitoEm||t.criadaEm)+
          (t.autoConcluida?' · <i>'+esc(t.autoConcluida)+'</i>':'')+
          (t.rs?' · <b style="color:#f87171;">RS/GARANTIA</b>':'')+
          (t.temFoto?' · <a class="foto" href="#" onclick="verFoto(\''+t.cardId+'\');return false;">ver foto</a>':'')+
          '</div></div>';
      }).join('');
    }
    if(r.rotas.length){
      html+='<div class="sec">🚚 Rotas ('+r.rotas.length+')</div>';
      html+=r.rotas.map(function(rt){
        return '<div class="card '+(rt.status==='finalizada'?'feito':'pend')+'"><span class="tag">🚚 Rota '+rt.num+' · '+esc(rt.dia)+'</span>'+
          '<span class="nm">'+(rt.status==='finalizada'?('Saiu '+(rt.tipoSaida==='parcial'?'PARCIAL':'COMPLETA')+' com '+esc(rt.motorista||'—')):'Em separação')+'</span>'+
          '<div class="meta">'+rt.itens.map(function(i){return esc(i.cliente)+(i.qtd>1?' ×'+i.qtd:'')+' ('+esc(i.status)+(i.motivo?': '+esc(i.motivo):'')+')';}).join(' · ')+
          (rt.placa||rt.telMotorista?'<br>'+(rt.placa?'🚗 '+esc(rt.placa):'')+(rt.telMotorista?' · 📱 '+esc(rt.telMotorista):''):'')+
          '<br>'+fmtD(rt.saidaEm||rt.criadaEm)+
          (rt.status==='finalizada'?'<br><button onclick="verFotoRota(\''+(rt.id||'')+'\')" style="margin-top:7px;background:#1d4ed8;border:none;border-radius:8px;padding:7px 14px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;">📸 VER FOTO DO MOTORISTA</button>':'')+
          '</div></div>';
      }).join('');
    }
    if(r.ml.length){
      html+='<div class="sec">📬 Mercado Livre — chegadas ('+r.ml.length+')</div>';
      html+=r.ml.map(function(m){
        return '<div class="card feito"><span class="nm">'+esc(m.descricao)+'</span>'+
          '<div class="meta">OS '+esc(m.os||'—')+' · → técnico <b>'+esc(m.tecnico)+'</b> · '+fmtD(m.em)+'</div></div>';
      }).join('');
    }
    el.innerHTML=html||'<div class="empty">Nada encontrado para "'+esc(q)+'"</div>';
  }catch(e){el.innerHTML='<div class="empty">Erro na busca</div>';}
}
async function verFotoRota(rotaId){
  if(!rotaId){alert('Rota sem identificador');return;}
  var ov=document.getElementById('ov-foto-rota'); if(ov)ov.remove();
  ov=document.createElement('div');
  ov.id='ov-foto-rota';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;';
  ov.innerHTML='<div style="color:#8b93a3;font-size:13px;">📸 carregando…</div>';
  ov.onclick=function(e){ if(e.target===ov)ov.remove(); };
  document.body.appendChild(ov);
  try{
    var r=await fetch('/api/almoxarifado?action=rota-foto&rota='+encodeURIComponent(rotaId)).then(function(x){return x.json();});
    if(r&&r.ok&&r.b64){
      var q=r.em?new Date(r.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
      ov.innerHTML='<div style="color:#fff;font-size:13px;font-weight:700;margin-bottom:8px;">📸 '+rotaId+(q?' · '+q:'')+'</div>'+
        '<img src="'+r.b64+'" style="max-width:100%;max-height:74vh;border-radius:10px;">'+
        '<div style="display:flex;gap:8px;margin-top:12px;">'+
          '<a href="'+r.b64+'" download="rota-'+rotaId+'.jpg" style="background:#242b39;border-radius:9px;padding:10px 18px;color:#fff;font-size:12px;font-weight:800;text-decoration:none;">⬇ baixar</a>'+
          '<button onclick="document.getElementById(\'ov-foto-rota\').remove()" style="background:#242b39;border:none;border-radius:9px;padding:10px 18px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;">fechar</button>'+
        '</div>';
    } else {
      ov.innerHTML='<div style="color:#fca5a5;font-size:13px;text-align:center;">Foto não encontrada para esta rota.<br><button onclick="document.getElementById(\'ov-foto-rota\').remove()" style="margin-top:12px;background:#242b39;border:none;border-radius:9px;padding:10px 18px;color:#fff;font-weight:800;cursor:pointer;">fechar</button></div>';
    }
  }catch(e){
    ov.innerHTML='<div style="color:#fca5a5;font-size:13px;">Erro: '+e.message+'<br><button onclick="document.getElementById(\'ov-foto-rota\').remove()" style="margin-top:12px;background:#242b39;border:none;border-radius:9px;padding:10px 18px;color:#fff;font-weight:800;cursor:pointer;">fechar</button></div>';
  }
}
async function verFoto(cardId){
  try{
    var r=await fetch('/api/almoxarifado?action=ver-foto&cardId='+encodeURIComponent(cardId)).then(function(x){return x.json();});
    if(r.ok&&r.foto&&r.foto.img){var w=window.open('');w.document.write('<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+r.foto.img+'" style="max-width:100%;max-height:100vh;"></body>');}
    else alert('Foto não encontrada');
  }catch(e){alert('Erro ao buscar a foto');}
}
</script>
</body>
</html>
