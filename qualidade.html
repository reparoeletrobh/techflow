<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  // Papel TV: acesso restrito às telas do sistema TV
  if(localStorage.getItem('tf_role')==='tv'&&location.pathname.indexOf('/tv')!==0){
    location.replace('/tv-adm');return;
  }
  var _f=window.fetch;
  window.fetch=function(u,o){
    var isApi=false;
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        isApi=true;o=o||{};
        var kk=localStorage.getItem('tf_key')||'';
        if(o.headers&&typeof o.headers.set==='function'){o.headers.set('x-tf-key',kk);}
        else{o.headers=Object.assign({},o.headers||{},{'x-tf-key':kk});}
      }
    }catch(e){}
    var p=_f.call(this,u,o);
    if(isApi){
      p=p.then(function(r){
        if(r&&r.status===401&&!window.__tfHealed){
          window.__tfHealed=true;
          localStorage.removeItem('tf_key');
          location.replace('/login?next='+encodeURIComponent(location.pathname));
        }
        return r;
      });
    }
    return p;
  };
  // Navegação/downloads para /api/ (links e window.open) também levam a chave
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a'):null;
    if(a){
      var hu=a.getAttribute('href')||'';
      if(hu.indexOf('/api/')>-1&&hu.indexOf('k=')===-1){
        a.setAttribute('href',hu+(hu.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||''));
      }
    }
  },true);
  var _wo=window.open;
  window.open=function(u){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('k=')===-1){
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||'');
        arguments[0]=u;
      }
    }catch(e){}
    return _wo.apply(window,arguments);
  };
})();
</script>

<script>
// ── 📊 painéis: origem, meta de 25, técnicos e fila do setor técnico ──
var _pq = null, _pqPer = 'hoje', _pqFilaAberta = false;
// a fila fica recolhida por padrão: são dezenas de fichas e o que se olha
// no dia a dia é o total, não a lista inteira
function pqFila(){
  _pqFilaAberta = !_pqFilaAberta;
  var c = document.getElementById('pq-fila-corpo');
  var s = document.getElementById('pq-seta');
  if(c) c.style.display = _pqFilaAberta ? 'block' : 'none';
  if(s) s.textContent = _pqFilaAberta ? '▾' : '▸';
}
function pqEsc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }
function pqPeriodo(p){ _pqPer = p; carregarPainelQualidade(); }
function pqAbrir(id){
  var el = document.getElementById('pqf-' + id);
  if(el) el.classList.toggle('on');
}
async function carregarPainelQualidade(){
  var cx = document.getElementById('painel-origem');
  if(!cx) return;
  var r = null;
  try { r = await fetch('/api/qualidade?action=painel&periodo=' + _pqPer)
    .then(function(x){ return x.json(); }); } catch(e){}
  if(!r || !r.ok){ cx.innerHTML = ''; return; }
  _pq = r;
  // a meta semanal é desenhada junto da diária, no painel de cima
  if(r.META_SEMANAL){
    var mudou = !_semanal || _semanal.feitas !== r.META_SEMANAL.feitas;
    _semanal = r.META_SEMANAL;
    if(mudou && typeof carregarPainelMeta === 'function') carregarPainelMeta();
  }
  var m = r.META_DIARIA || {}, o = r.ORIGENS || {}, f = r.FILA_TECNICO || {};
  var pct = Math.min(100, m.percentual || 0);
  var corBarra = pct >= 100 ? '#34d399' : pct >= 60 ? '#fbbf24' : '#f87171';

  var htmlMeta = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'
    + '<span style="font-size:11.5px;font-weight:800;color:#8b93a3;">📊 POR ORIGEM E FILA DO TÉCNICO</span>'
    + '<div style="margin-left:auto;display:flex;gap:5px;">'
      + ['hoje','semana','mes'].map(function(p){
          return '<button onclick="pqPeriodo(\'' + p + '\')" style="background:'
            + (_pqPer===p?'rgba(96,165,250,.16)':'rgba(255,255,255,.03)') + ';border:1px solid '
            + (_pqPer===p?'#60a5fa':'#1e2430') + ';border-radius:7px;padding:5px 11px;font-size:11px;'
            + 'font-weight:700;color:' + (_pqPer===p?'#60a5fa':'#8b93a3') + ';cursor:pointer;">'
            + (p==='hoje'?'Hoje':p==='semana'?'7 dias':'30 dias') + '</button>';
        }).join('')
    + '</div></div>';

  var card = function(t, dados, cor, icone){
    return '<div class="pq-c">'
      + '<div class="n" style="color:' + cor + ';">' + (dados.entraram||0) + '</div>'
      + '<div class="l">' + icone + ' ' + t + '</div>'
      + '<div class="d">✅ ' + (dados.aprovadas||0) + ' · 🔧 ' + (dados.reprovadas||0)
        + (dados.aguardando ? ' · ⏳ ' + dados.aguardando : '')
        + (dados.taxaAprovacao != null ? ' · ' + dados.taxaAprovacao + '%' : '') + '</div>'
      + '</div>';
  };
  var htmlOrigem = '<div class="pq-cards">'
    + card('Setor técnico', o.tecnico||{}, '#60a5fa', '🔧')
    + card('Garantia', o.garantia||{}, '#22d3ee', '🛡️')
    + card('Avulsas', o.avulsa||{}, '#a78bfa', '📋')
    + '</div>';

  var htmlTec = '';   // o detalhamento por categoria já está no painel de cima

  var fichas = r.FICHAS_POR_COLUNA || {};
  var htmlFila = '<div class="pq-sec">'
    + '<h4 onclick="pqFila()" style="cursor:pointer;display:flex;align-items:center;gap:8px;">'
      + '<span id="pq-seta" style="color:#5a6270;font-size:11px;">' + (_pqFilaAberta ? '▾' : '▸') + '</span>'
      + '<span>🔧 Fila do setor técnico — ' + (f.total||0) + ' serviço(s) por concluir</span>'
      + (f.atrasadas ? '<span class="pq-tag pq-atrasada" style="background:rgba(248,113,113,.15);">'
          + '🔴 ' + f.atrasadas + ' acima de ' + (r.limiteAtrasoHoras||48) + 'h</span>' : '')
      + '</h4>'
    + '<div id="pq-fila-corpo" style="display:' + (_pqFilaAberta ? 'block' : 'none') + ';">'
    + (f.colunas||[]).filter(function(c){ return c.quantas > 0; }).map(function(c){
        var lista = fichas[c.id] || [];
        return '<div class="pq-col" onclick="pqAbrir(\'' + c.id + '\')">'
          + '<span style="flex:1;font-size:12.5px;">' + pqEsc(c.nome) + '</span>'
          + '<span class="q">' + c.quantas + '</span>'
          + '<span style="color:#5a6270;font-size:11px;">▾</span></div>'
          + '<div class="pq-fichas" id="pqf-' + c.id + '">'
          + (lista.length ? lista.map(function(x){
              var tt = x.horas != null
                ? (x.horas >= 24 ? (x.horas/24).toFixed(1) + 'd' : Math.round(x.horas) + 'h')
                : '—';
              return '<div' + (x.atrasada ? ' class="pq-atrasada"' : '') + '>'
                + pqEsc(x.cliente).slice(0,22) + ' ' + x.telefone
                + ' | ' + pqEsc(x.equipamento)
                + (x.tecnico ? ' | ' + pqEsc(x.tecnico) : '')
                + ' | há ' + tt + (x.atrasada ? ' 🔴' : '') + '</div>';
            }).join('') : '<div>sem fichas</div>')
          + '</div>';
      }).join('')
    + '</div></div>';

  cx.innerHTML = htmlMeta + htmlOrigem + htmlTec + htmlFila;
}

// ── 📅 data e hora legíveis, em horário de Brasília ──
function fmtDH(d){
  if(!d) return '—';
  var t = new Date(d);
  if(isNaN(t.getTime())) return '—';
  return t.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'})
    + ' às ' + t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
}
// ⏱ há quanto tempo espera — só para o que ainda não foi inspecionado
function esperaHTML(i){
  if(i.status!=='aguardando' || !i.criadoEm) return '';
  var ms = Date.now() - new Date(i.criadoEm).getTime();
  if(ms < 0 || isNaN(ms)) return '';
  var h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  var txt = h>=24 ? Math.floor(h/24)+'d '+(h%24)+'h' : (h>0 ? h+'h'+(m>0?m+'min':'') : m+'min');
  var cor = h>=24 ? '#f87171' : h>=4 ? '#fbbf24' : '#5b6373';
  return ' <span style="color:'+cor+';font-weight:700;">· esperando há '+txt+'</span>';
}
// ⏱ quanto tempo levou entre entrar e ser aprovado
function duracaoHTML(i){
  if(!i.criadoEm || !i.aprovadoEm) return '';
  var ms = new Date(i.aprovadoEm).getTime() - new Date(i.criadoEm).getTime();
  if(!(ms>0)) return '';
  var h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  var txt = h>=24 ? Math.floor(h/24)+'d '+(h%24)+'h' : (h>0 ? h+'h'+(m>0?m+'min':'') : m+'min');
  return ' <span style="color:#5b6373;">· levou '+txt+'</span>';
}

// 🛡️ ao escolher garantia, carrega os itens da fila para vincular

async function salvarAvulsa(){
  var tec = (document.getElementById('av-tecnico')||{}).value || '';
  var desc = (document.getElementById('av-descricao')||{}).value || '';
  var cat = (document.getElementById('av-categoria')||{}).value || 'producao_interna';
  var garId = (document.getElementById('av-garantia-id')||{}).value || null;
  var obs = (document.getElementById('av-obs')||{}).value || '';
  var err = document.getElementById('av-erro');
  var msg = function(t,c){ if(err) err.innerHTML='<div style="font-size:12px;color:'+c+';">'+t+'</div>'; };
  if(!tec){ msg('Selecione o técnico.','#f87171'); return; }
  if(!desc.trim()){ msg('Descreva o que foi feito.','#f87171'); return; }
  var b = document.getElementById('av-salvar');
  if(b){ b.disabled=true; b.textContent='⏳ criando…'; }
  var r = null;
  try {
    r = await fetch('/api/qualidade?action=criar-avulsa',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tecnico:tec,descricao:desc,categoria:cat,obs:obs,garantiaId:garId})})
      .then(function(x){return x.json();});
  } catch(e){ r = {ok:false,error:e.message}; }
  if(r && r.ok){
    msg('✅ '+(r.inspecao&&r.inspecao.os||'ficha')+' criada para '+tec,'#4ade80');
    setTimeout(function(){
      var ov=document.getElementById('ov-avulsa'); if(ov)ov.remove();
      load(); carregarPainelMeta();
    }, 1200);
  } else {
    msg('🚨 '+((r&&r.error)||'não consegui criar'),'#f87171');
    if(b){ b.disabled=false; b.textContent='Criar ficha'; }
  }
}

// ── 🎯 PAINEL DE META: 25 fichas por dia no controle de qualidade ──
const META_DIA = 25;

// ── 📅 meta semanal do setor técnico: 150 por ciclo comercial ──
// A diária zera todo dia e não mostra se a semana fecha; esta acompanha o
// ciclo inteiro e diz quantas faltam por dia para chegar lá.
var _semanal = null;
function _barraSemanal(){
  var s = _semanal;
  if(!s) return '';
  var pctS = Math.min(100, s.percentual || 0);
  var corS = pctS >= 100 ? '#34d399'
    : (s.situacao === 'no ritmo' ? '#60a5fa' : pctS >= 50 ? '#fbbf24' : '#f87171');
  return '<div style="margin-top:11px;padding-top:11px;border-top:1px solid #1e2430;">'
    + '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;">'
      + '<span style="font-size:12.5px;font-weight:800;">📅 Meta da semana — ' + s.meta + ' fichas</span>'
      + '<span style="font-size:11px;color:#5a6270;">dia ' + (s.diaDoCiclo||'') + ' · desde ' + (s.cicloComecou||'') + '</span>'
      + '<span style="margin-left:auto;font-size:12.5px;font-weight:900;color:' + corS + ';">'
        + s.feitas + ' / ' + s.meta + ' · ' + pctS + '%</span>'
    + '</div>'
    + '<div class="mt-barra" style="position:relative;">'
      + '<div class="mt-fill" style="width:' + pctS + '%;background:' + corS + '"></div>'
      // 📍 marca onde a equipe deveria estar a esta altura do ciclo
      + (s.esperadoAteAgora ? '<div style="position:absolute;top:-2px;bottom:-2px;left:'
          + Math.min(100, Math.round(s.esperadoAteAgora / s.meta * 100)) + '%;width:2px;'
          + 'background:rgba(255,255,255,.45);" title="esperado a esta altura: '
          + s.esperadoAteAgora + '"></div>' : '')
    + '</div>'
    + '<div style="font-size:10.5px;color:#5a6270;margin-top:5px;">'
      + (s.situacao === 'no ritmo' ? '✅ no ritmo' : '⚠️ ' + s.situacao)
      + ' · esperado até agora ' + s.esperadoAteAgora
      + (s.faltam ? ' · faltam ' + s.faltam + ', cerca de ' + s.faltamPorDia + ' por dia' : ' · meta atingida')
      + '</div>'
    + '</div>';
}

async function carregarPainelMeta(){
  const el = document.getElementById('painel-meta');
  if(!el) return;
  let c = null, falha = null;
  try {
    const resp = await fetch('/api/qualidade?action=contadores');
    if(!resp.ok) falha = 'HTTP ' + resp.status;
    c = await resp.json();
    if(c && c.ok === false) falha = c.error || 'retorno sem ok';
  } catch(e){ falha = e.message; }
  // 🔊 em vez de sumir em silêncio, mostra o motivo — painel mudo esconde o problema
  if(!c || !c.ok){
    el.innerHTML = '<div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);'
      + 'border-radius:11px;padding:11px 14px;font-size:11.5px;color:#fbbf24;">'
      + '⚠️ não consegui carregar os indicadores — ' + (falha||'motivo desconhecido') + '</div>';
    return;
  }
  const hoje = (c.ENTRARAM && c.ENTRARAM.hojeSemGarantia != null)
    ? c.ENTRARAM.hojeSemGarantia : ((c.ENTRARAM && c.ENTRARAM.hoje) || 0);
  // 🏷️ badge do título: entraram hoje / concluídas hoje
  const bd = document.getElementById('badge-cq');
  if(bd){
    const conc = (c.CONCLUIDAS && c.CONCLUIDAS.hoje) || 0;
    const entTudo = (c.ENTRARAM && c.ENTRARAM.hoje) || 0;
    bd.textContent = entTudo + '/' + conc;
    bd.title = hoje + ' entraram hoje · ' + conc + ' concluída(s) hoje';
    bd.style.background = conc >= hoje && hoje > 0 ? 'rgba(74,222,128,.16)'
      : (hoje ? 'rgba(245,158,11,.16)' : '');
    bd.style.color = conc >= hoje && hoje > 0 ? '#4ade80' : (hoje ? '#fbbf24' : '');
  }
  const pct = Math.min(100, Math.round(hoje / META_DIA * 100));
  const cor = pct >= 100 ? '#4ade80' : pct >= 60 ? '#fbbf24' : '#f87171';
  const kpi = (v,l,cr) => '<div class="mt-card"><div class="mt-v" style="color:'+(cr||'#f0f2f5')+'">'+v+'</div><div class="mt-l">'+l+'</div></div>';
  el.innerHTML = '<div class="mt-box">'
    + '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;">'
      + '<span class="mt-titulo">🎯 Meta do dia — '+META_DIA+' fichas</span>'
      + '<span style="font-size:11px;color:#5a6270;">semana desde '+(c.semanaComecaEm||'')+'</span>'
      + '<span style="margin-left:auto;font-size:12.5px;font-weight:900;color:'+cor+'">'+hoje+' / '+META_DIA+' · '+pct+'%</span>'
    + '</div>'
    + '<div class="mt-barra"><div class="mt-fill" style="width:'+pct+'%;background:'+cor+'"></div></div>'
    + _barraSemanal()
    + '<div class="mt-grid">'
      + kpi(hoje, 'ENTRARAM HOJE', cor)
      + kpi((c.ENTRARAM&&c.ENTRARAM.semana)||0, 'NA SEMANA', '#60a5fa')
      + kpi((c.CONCLUIDAS&&c.CONCLUIDAS.hoje)||0, 'CONCLUÍDAS HOJE', '#4ade80')
      + kpi((c.CONCLUIDAS&&c.CONCLUIDAS.semana)||0, 'CONCLUÍDAS SEMANA', '#4ade80')
      + kpi(c.AGUARDANDO||0, 'AGUARDANDO', '#fbbf24')
      + ((c.ENTRARAM&&c.ENTRARAM.deGarantiaHoje) ? kpi(c.ENTRARAM.deGarantiaHoje, 'DE GARANTIA (fora da meta)', '#a78bfa') : '')
    + '</div>'
    + ((c.POR_TECNICO&&c.POR_TECNICO.length)
      ? '<div style="font-size:11px;font-weight:900;color:#8b93a3;margin-top:12px;">👨‍🔧 POR TÉCNICO <span style="font-weight:400;color:#5a6270;">— clique para ver as OSs</span></div>'
        + '<div class="mt-tec">'+c.POR_TECNICO.map(function(t){
            var nome = String(t).split('|')[0].trim();
            return '<div style="cursor:pointer;padding:2px 0;" onclick="verOssTecnico(\''+nome.replace(/'/g,"")+'\')" '
              + 'onmouseover="this.style.color=\'#60a5fa\'" onmouseout="this.style.color=\'\'">'
              + '▸ '+String(t).replace(/</g,'&lt;')+'</div>';
          }).join('')+'</div>'
        + '<div id="oss-tecnico"></div>'
      : '')
  + '</div>';
  window._ossPorTecnico = c.OSS_POR_TECNICO || {};
}
function verOssTecnico(nome){
  const alvo = document.getElementById('oss-tecnico');
  if(!alvo) return;
  const lista = (window._ossPorTecnico||{})[nome] || [];
  if(alvo.dataset.aberto === nome){ alvo.innerHTML=''; alvo.dataset.aberto=''; return; }
  alvo.dataset.aberto = nome;
  alvo.innerHTML = '<div style="background:#0f1319;border:1px solid #2a3140;border-radius:9px;padding:10px 12px;margin-top:9px;">'
    + '<div style="font-size:11.5px;font-weight:900;color:#60a5fa;margin-bottom:7px;">📋 '+nome+' — '+lista.length+' OS(s) nesta semana</div>'
    + (lista.length
      ? '<div style="font-family:ui-monospace,monospace;font-size:10.5px;color:#c9ced6;line-height:1.9;max-height:260px;overflow-y:auto;">'
        + lista.map(function(x){return String(x).replace(/</g,'&lt;');}).join('<br>')+'</div>'
      : '<div style="font-size:11px;color:#5a6270;">nenhuma OS nesta semana</div>')
  + '</div>';
}

        +((i.equipamentoTexto||i.equipDesc)?' · '+esc(i.equipamentoTexto||i.equipDesc):'')+'</div></div>'+pill+'</div>'+
      '<div class="meta">'+(i.os?'<b>'+esc(i.os)+'</b>':esc(i.id))+
      (i.avulsa?' <span style="background:rgba(168,85,247,.2);color:#c084fc;padding:1px 6px;'
        +'border-radius:8px;font-size:9.5px;font-weight:800;">AVULSA'
        +(i.categoria?' · '+esc(String(i.categoria).replace('_',' ')):'')+'</span>':'')+
      // 📅 quando entrou no controle de qualidade, e há quanto tempo espera
      (i.criadoEm?'<br>📥 Entrou: <b>'+fmtDH(i.criadoEm)+'</b>'+esperaHTML(i):'')+
      (i.tecnico?'<br>🔧 Técnico: <b>'+esc(i.tecnico)+'</b>':'')+
      (i.inspetor?' · 🔍 Inspetor: <b>'+esc(i.inspetor)+'</b>':'')+
      (rep?'<br>⚠️ '+rep+' reprovação(ões) anteriores':'')+
      (i.aprovadoEm?'<br>✅ Aprovado: <b>'+fmtDH(i.aprovadoEm)+'</b>'+duracaoHTML(i):'')+
      (i.obsTecnica?'<br>🗒 '+esc(String(i.obsTecnica).slice(0,120)):'')+
      (i.reprovadoEm?'<br>🔧 Reprovado: '+fmtDH(i.reprovadoEm):'')+'</div>'+
      '<div class="acts">'+acts+'</div></div>';
  }).join('');
}

function renderTec(){
  var el=document.getElementById('lista');
  var chips=(_db.config.tecnicos||[]).map(function(t,ix){
    return '<div class="chip">'+esc(t)+'<b onclick="delTec('+ix+')">✕</b></div>';
  }).join('')||'<span style="color:#5b6373;font-size:13px;">Nenhum técnico cadastrado</span>';
  el.innerHTML='<div class="card" style="grid-column:1/-1;">'+
    '<div class="nm">⚙️ Equipe técnica</div>'+
    '<div class="eq" style="margin-top:4px;">Os nomes aparecem nos campos "Técnico" e "Inspetor" — e alimentam as métricas de qualidade por pessoa.</div>'+
    '<div class="chips" id="chips-tec">'+chips+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;">'+
    '<input id="novo-tec" placeholder="Nome do técnico" style="flex:1;background:#12161d;border:1px solid #242b39;border-radius:9px;padding:10px 12px;color:#f0f2f5;">'+
    '<button class="btn b-ok" onclick="addTec()">Adicionar</button></div></div>';
}

async function addTec(){
  var v=document.getElementById('novo-tec').value.trim();
  if(!v)return;
  var lst=(_db.config.tecnicos||[]).concat([v]);
  await salvarTec(lst);
}
async function delTec(ix){
  var lst=(_db.config.tecnicos||[]).slice();lst.splice(ix,1);
  await salvarTec(lst);
}
async function salvarTec(lst){
  var r=await fetch('/api/qualidade?action=config-tecnicos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tecnicos:lst})}).then(function(x){return x.json();});
  if(r.ok){_db.config.tecnicos=r.tecnicos;render();}
}

function setTab(el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');_tab=el.getAttribute('data-v');render();
}

// ═══ NOVA ═══
function abrirNova(){
  fillTecSelect('n-tec','— selecionar —');
  document.getElementById('ov-nova').classList.add('on');
}
async function criar(){
  var btn=document.getElementById('btn-criar');btn.disabled=true;
  var body={
    cliente:document.getElementById('n-cliente').value.trim(),
    tel:document.getElementById('n-tel').value.trim(),
    os:document.getElementById('n-os').value.trim(),
    equipamento:document.getElementById('n-equip').value,
    equipDesc:document.getElementById('n-desc').value.trim(),
    tecnico:document.getElementById('n-tec').value,
  };
  if(!body.cliente){alert('Informe o cliente');btn.disabled=false;return;}
  var r=await fetch('/api/qualidade?action=criar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  btn.disabled=false;
  if(r.ok){fechar('ov-nova');['n-cliente','n-tel','n-os','n-desc'].forEach(function(id){document.getElementById(id).value='';});load();}
  else alert('Erro: '+(r.error||'falha'));
}

// ═══ INSPEÇÃO ═══
function itensDe(i){
  // 🎯 checklist do equipamento; sem categoria conhecida, usa o genérico
  var l = CK_ESP[i.equipamento];
  if(l && l.length) return l;
  return CK_ESP.outro || [];
}

function abrirInsp(id){
  try { _abrirInsp(id); }
  catch(e){ alert('Não consegui abrir a inspeção: '+(e&&e.message||e)
    +'\n\nRecarregue a página (Ctrl+F5) e tente de novo.'); }
}
function _abrirInsp(id){
  _atual=_db.inspecoes.find(function(x){return x.id===id;});
  if(!_atual){ alert('Inspeção não encontrada. Atualize a lista.'); return; }
  document.getElementById('i-titulo').textContent='🔍 '+_atual.id+' — '+_atual.cliente+' ('+(EQUIP_LBL[_atual.equipamento]||'')+')';
  fillTecSelect('i-inspetor','— quem está inspecionando? —');
  if(_atual.inspetor)document.getElementById('i-inspetor').value=_atual.inspetor;
  var itens=itensDe(_atual);
  var espT=EQUIP_LBL[_atual.equipamento]||'Específico';
  if(!itens.length){
    // o container do checklist é i-checks — usar outro id fazia a função quebrar
    // antes de abrir o modal, e o botão Inspecionar ficava sem reação
    document.getElementById('i-checks').innerHTML =
      '<div style="padding:20px;text-align:center;color:#fbbf24;font-size:13px;">'
      + '⚠️ não há checklist para este equipamento<br>'
      + '<span style="font-size:11.5px;color:#8b93a3;">'
      + esc(_atual.equipamentoTexto||_atual.equipamento||'') + '</span></div>';
    document.getElementById('ov-insp').classList.add('on');
    return;
  }
  var html='<div class="sec-t">✔️ Verificações gerais</div>';
  itens.forEach(function(it,ix){
    if(ix===CK_UNIVERSAL.length)html+='<div class="sec-t">🎯 Específico — '+espT+'</div>';
    var st=(_atual.checklist||{})[it.id]||{};
    html+='<div class="ck'+(st.v==='falha'?' falha':'')+'" id="ck-'+it.id+'">'+
      '<div class="q"><div class="t">'+it.t+'</div><div class="ops">'+
      '<button class="op ok'+(st.v==='ok'?' sel':'')+'" onclick="mark(\''+it.id+'\',\'ok\')">✓</button>'+
      '<button class="op fl'+(st.v==='falha'?' sel':'')+'" onclick="mark(\''+it.id+'\',\'falha\')">✗</button>'+
      '<button class="op na'+(st.v==='na'?' sel':'')+'" onclick="mark(\''+it.id+'\',\'na\')">N/A</button>'+
      '</div></div>'+
      '<textarea id="obs-'+it.id+'" placeholder="O que foi encontrado? (obrigatório na falha)">'+esc(st.obs||'')+'</textarea></div>';
  });
  document.getElementById('i-checks').innerHTML=html;
  prog();
  document.getElementById('ov-insp').classList.add('on');
}
function mark(id,v){
  _atual.checklist=_atual.checklist||{};
  var cur=_atual.checklist[id]||{};
  cur.v=v;_atual.checklist[id]=cur;
  var el=document.getElementById('ck-'+id);
  el.classList.toggle('falha',v==='falha');
  el.querySelectorAll('.op').forEach(function(o){o.classList.remove('sel');});
  el.querySelector('.op.'+(v==='ok'?'ok':v==='falha'?'fl':'na')).classList.add('sel');
  prog();
}
function coletaChecklist(){
  var ck={};
  if(!_atual) return ck;
  // parte do que JÁ está marcado na ficha, para não perder item cuja categoria mudou
  var jaMarcado=_atual.checklist||{};
  Object.keys(jaMarcado).forEach(function(id){
    var obs=document.getElementById('obs-'+id);
    ck[id]={v:(jaMarcado[id]||{}).v||'',obs:obs?obs.value.trim():((jaMarcado[id]||{}).obs||'')};
  });
  // e acrescenta os itens da categoria atual
  (itensDe(_atual)||[]).forEach(function(it){
    var cur=jaMarcado[it.id]||{};
    var obs=document.getElementById('obs-'+it.id);
    ck[it.id]={v:cur.v||'',obs:obs?obs.value.trim():(cur.obs||'')};
  });
  return ck;
}
function prog(){
  var itens=itensDe(_atual);
  var f=0;itens.forEach(function(it){if(((_atual.checklist||{})[it.id]||{}).v)f++;});
  document.getElementById('i-prog').textContent='Progresso: '+f+' / '+itens.length+' itens verificados';
  document.getElementById('btn-apr').disabled=(f<itens.length);
}
async function salvarParcial(){
  if(!_atual)return;
  await fetch('/api/qualidade?action=salvar-checklist',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:_atual.id,checklist:coletaChecklist(),inspetor:document.getElementById('i-inspetor').value})});
  fechar('ov-insp');load();
}
async function aprovar(){
  var ck=coletaChecklist();
  var falhas=Object.keys(ck).filter(function(k){return ck[k].v==='falha';});
  if(falhas.length){alert('Há itens marcados com ✗ falha — corrija ou use Reprovar.');return;}
  var insp=document.getElementById('i-inspetor').value;
  if(!insp){alert('Informe o inspetor.');return;}
  var b=document.getElementById('btn-apr');b.disabled=true;
  var r=await fetch('/api/qualidade?action=aprovar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:_atual.id,checklist:ck,inspetor:insp})}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  b.disabled=false;
  if(r.ok){fechar('ov-insp');await load();verCert(_atual.id);}
  else alert('Erro: '+(r.error||'falha'));
}
async function reprovar(){
  // 🔊 nada de botão mudo: qualquer falha aqui vira mensagem na tela
  try{ await _reprovar(); }
  catch(e){ alert('Erro ao reprovar: '+(e&&e.message||e)+'\n\nRecarregue a página e tente de novo.'); }
}
async function _reprovar(){
  if(!_atual){alert('Nenhuma inspeção aberta. Feche e abra a ficha de novo.');return;}
  var ck=coletaChecklist();
  var falhas=[];
  // 🔍 lê as falhas do PRÓPRIO checklist marcado, não da lista teórica de itens.
  // Quando o equipamento da ficha não bate com nenhuma categoria conhecida, a lista
  // vinha vazia e o botão recusava dizendo que nada foi marcado.
  var mapa={};
  (itensDe(_atual)||[]).forEach(function(it){ mapa[it.id]=it.t; });
  Object.keys(ck||{}).forEach(function(id){
    if((ck[id]||{}).v==='falha') falhas.push({item:mapa[id]||id,obs:(ck[id]||{}).obs||''});
  });
  if(!falhas.length){alert('Marque com ✗ os itens que falharam antes de reprovar.');return;}
  var semObs=falhas.filter(function(f){return !String(f.obs||'').trim();});
  if(semObs.length){
    alert('Descreva o que foi encontrado nestes itens marcados com ✗:\n\n'
      + semObs.map(function(f){return '• '+f.item;}).join('\n'));
    return;
  }
  var elIn=document.getElementById('i-inspetor');
  var insp=elIn?elIn.value:'';
  if(!insp){alert('Selecione quem está inspecionando (campo Inspetor no topo).');return;}
  if(!confirm('Reprovar e enviar para retrabalho?\n\n'+falhas.map(function(f){return '✗ '+f.item;}).join('\n')))return;
  var b=document.getElementById('btn-rep'); if(b)b.disabled=true;
  var r=await fetch('/api/qualidade?action=reprovar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:_atual.id,checklist:ck,inspetor:insp,itensFalhos:falhas})}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  if(b)b.disabled=false;
  if(r.ok){fechar('ov-insp');load();carregarPainelMeta();}
  else alert('Não consegui reprovar: '+(r.error||'o servidor não respondeu')
    +'\n\nSe persistir, recarregue a página e tente de novo.');
}
async function reinspecionar(id){
  if(!confirm('O equipamento voltou do retrabalho? O checklist será reiniciado para nova inspeção.'))return;
  await fetch('/api/qualidade?action=reinspecionar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
  load();
}
async function excluir(id){
  if(!confirm('Excluir esta inspeção?'))return;
  await fetch('/api/qualidade?action=excluir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
  load();
}

// ═══ CERTIFICADO ═══
var _certTexto='';
function verCert(id){
  var i=_db.inspecoes.find(function(x){return x.id===id;});
  if(!i)return;
  var itens=itensDe(i).filter(function(it){return ((i.checklist||{})[it.id]||{}).v==='ok';});
  var html='<h3>✅ Certificado de Controle de Qualidade</h3>'+
    '<div class="sub">Reparo Eletro · Assistência Técnica Especializada · Rua Ouro Preto, 663 - Barro Preto, BH</div>'+
    '<div><b>Cliente:</b> '+esc(i.cliente)+'</div>'+
    (i.os?'<div><b>OS:</b> '+esc(i.os)+' · <b>QC:</b> '+i.id+'</div>':'<div><b>QC:</b> '+i.id+'</div>')+
    '<div><b>Equipamento:</b> '+(EQUIP_LBL[i.equipamento]||'')+(i.equipDesc?' — '+esc(i.equipDesc):'')+'</div>'+
    '<div><b>Data da aprovação:</b> '+fmtD(i.aprovadoEm)+'</div>'+
    '<div class="ln"></div>'+
    '<div style="font-weight:800;margin-bottom:6px;">Verificações realizadas e aprovadas:</div>'+
    itens.map(function(it){return '<div class="it">✓ '+it.t+'</div>';}).join('')+
    '<div class="ln"></div>'+
    '<div><b>Técnico responsável:</b> '+esc(i.tecnico||'—')+' · <b>Inspetor de qualidade:</b> '+esc(i.inspetor||'—')+'</div>'+
    '<div class="ft">Este equipamento passou pelo processo completo de controle de qualidade da Reparo Eletro antes da entrega.<br><br><b>Em breve você vai receber o vídeo mostrando os testes na prática — e a nossa equipe prosseguirá para emitir a sua garantia e fazer a sua entrega.</b></div>';
  document.getElementById('cert-body').innerHTML=html;
  _certTel=i.tel||'';
  _certTexto='✅ *CERTIFICADO DE CONTROLE DE QUALIDADE*\n_Reparo Eletro — Assistência Técnica Especializada_\n\n'+
    '*Cliente:* '+i.cliente+'\n'+(i.os?'*OS:* '+i.os+'\n':'')+
    '*Equipamento:* '+(EQUIP_LBL[i.equipamento]||'')+(i.equipDesc?' — '+i.equipDesc:'')+'\n'+
    '*Aprovado em:* '+fmtD(i.aprovadoEm)+'\n\n*Verificações aprovadas:*\n'+
    itens.map(function(it){return '✓ '+it.t;}).join('\n')+
    '\n\n*Técnico:* '+(i.tecnico||'—')+'\n*Inspetor:* '+(i.inspetor||'—')+
    '\n\n_Seu equipamento passou pelo nosso processo completo de controle de qualidade antes da entrega._\n\n📹 *Em breve você vai receber o vídeo mostrando os testes na prática* — e a nossa equipe prosseguirá para emitir a sua garantia e fazer a sua entrega. 💚';
  document.getElementById('ov-cert').classList.add('on');
}
var _certTel='';
async function enviarCertZap(){
  if(!_certTel){alert('Esta ficha não tem telefone cadastrado.');return;}
  var b=document.getElementById('btn-zap');b.disabled=true;b.textContent='Enviando...';
  var r=await fetch('/api/wa-bot?action=enviar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tel:_certTel,texto:_certTexto,acaoAprovada:'certificado_qc'})}).then(function(x){return x.json();}).catch(function(){return{ok:false,error:'rede'};});
  b.disabled=false;b.textContent='📨 Enviar no WhatsApp';
  if(r.ok)alert('✅ Certificado enviado no WhatsApp!');
  else alert('Não foi possível enviar: '+(r.error||r.meta||'falha')+'\n\nDica: fora da janela de 24h o envio livre é bloqueado pela Meta — use o Copiar texto ou aguarde o cliente responder.');
}
function copiarCert(){
  navigator.clipboard.writeText(_certTexto).then(function(){alert('Copiado! Cole no WhatsApp do cliente.');});
}

// helpers
function fillTecSelect(id,ph){
  var s=document.getElementById(id);
  s.innerHTML='<option value="">'+ph+'</option>'+(_db.config.tecnicos||[]).map(function(t){return '<option>'+esc(t)+'</option>';}).join('');
}
function fechar(id){document.getElementById(id).classList.remove('on');}
function esc(s){return String(s||'').replace(/</g,'&lt;');}
function fmtD(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}

load();
// 📊 os dois convivem: o painel de meta e produção semanal por técnico, que já
// existia e é a leitura do dia a dia, e abaixo dele os blocos por origem e a
// fila do setor técnico
carregarPainelMeta();
carregarPainelQualidade();
setInterval(function(){carregarPainelMeta();carregarPainelQualidade();},120000);
setInterval(function(){if(!document.hidden)load();},120000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
</script>
