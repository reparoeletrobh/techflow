<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPIs — Reparo Eletro</title>
<style>
:root{
  --bg:#06070a; --painel:#0c0e13; --card:#111419; --linha:#1c212b;
  --txt:#f4f6f8; --dim:#7d8694; --fraco:#4d5563;
  --a1:#38bdf8; --a2:#818cf8; --a3:#a78bfa; --a4:#c084fc;
  --a5:#e879f9; --a6:#f472b6; --a7:#fb7185; --verde:#34d399;
  --ambar:#fbbf24; --vermelho:#fb7185;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
  padding:26px 26px 70px;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 900px 500px at 12% -8%,rgba(56,189,248,.07),transparent),
                   radial-gradient(ellipse 700px 450px at 88% 4%,rgba(167,139,250,.06),transparent);
  background-attachment:fixed;}
a{color:inherit;text-decoration:none;}

.topo{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.titulo{font-size:29px;font-weight:800;letter-spacing:-1.1px;line-height:1.05;}
.titulo em{font-style:normal;
  background:linear-gradient(101deg,var(--a1),var(--a3) 48%,var(--a6));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:11.5px;color:var(--fraco);font-family:var(--mono);margin-top:7px;letter-spacing:.02em;}
.voltar{background:rgba(255,255,255,.03);border:1px solid var(--linha);border-radius:10px;
  padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer;transition:.16s;}
.voltar:hover{color:var(--txt);border-color:#2b3444;background:rgba(255,255,255,.06);}

.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:24px;}
.fbtn{background:rgba(255,255,255,.025);border:1px solid var(--linha);border-radius:9px;
  padding:9px 18px;font-size:12.5px;font-weight:650;color:var(--dim);cursor:pointer;transition:.16s;}
.fbtn:hover{color:var(--txt);border-color:#2b3444;}
.fbtn.on{background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(167,139,250,.1));
  border-color:rgba(56,189,248,.5);color:var(--a1);}
.data-in{background:rgba(255,255,255,.025);border:1px solid var(--linha);border-radius:9px;
  padding:8px 11px;color:var(--txt);font-size:12px;font-family:var(--mono);outline:none;}
.data-in:focus{border-color:var(--a1);}

/* resumo */
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:26px;}
.rcard{background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.008));
  border:1px solid var(--linha);border-radius:17px;padding:19px 21px;position:relative;overflow:hidden;
  backdrop-filter:blur(10px);transition:.22s;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;}
.rcard:hover{border-color:rgba(255,255,255,.16);transform:translateY(-2px);
  box-shadow:0 16px 38px -22px var(--c,var(--a1));}
.rcard::after{content:'';position:absolute;inset:0 auto auto 0;width:100%;height:2px;
  background:linear-gradient(90deg,var(--c,var(--a1)),transparent 72%);
  box-shadow:0 0 18px var(--c,var(--a1));}
/* halo difuso no canto */
.rcard::before{content:'';position:absolute;top:-46px;right:-46px;width:120px;height:120px;
  border-radius:50%;background:var(--c,var(--a1));opacity:.09;filter:blur(28px);pointer-events:none;}
.rval{filter:saturate(1.1);}
.rlbl{font-size:9.5px;font-weight:750;color:var(--fraco);letter-spacing:.11em;text-transform:uppercase;}
.rval{font-family:var(--mono);font-size:32px;font-weight:680;line-height:1;margin-top:10px;
  letter-spacing:-1.8px;text-shadow:0 0 30px currentColor;}
.rsub{font-size:10.5px;color:var(--fraco);margin-top:6px;}

/* frente */
.frente{background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%),var(--painel);
  border:1px solid var(--linha);border-radius:20px;padding:23px 25px;margin-bottom:18px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -40px rgba(0,0,0,.9);}
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.fnome{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.ftag{font-size:9.5px;font-weight:750;padding:4px 10px;border-radius:20px;letter-spacing:.07em;text-transform:uppercase;}
.froi{margin-left:auto;text-align:right;}
.froi b{display:block;font-family:var(--mono);font-size:24px;font-weight:680;line-height:1;
  letter-spacing:-1.2px;text-shadow:0 0 24px currentColor;}
.froi span{font-size:9.5px;color:var(--fraco);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}

/* ▶️ FUNIL HORIZONTAL: colunas lado a lado, altura decrescente da esquerda para a direita */
.funil{display:flex;align-items:flex-start;gap:5px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;}
.funil::-webkit-scrollbar{height:5px;}
.funil::-webkit-scrollbar-thumb{background:var(--linha);border-radius:3px;}
.passo{flex:1 1 0;min-width:126px;position:relative;display:flex;flex-direction:column;
  justify-content:flex-start;overflow:visible;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.014));
  border:1px solid var(--linha);border-top:2.5px solid var(--c);
  border-radius:13px 13px 11px 11px;padding:15px 14px 14px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,border-color .22s;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 -18px 34px -26px var(--c) inset;}
/* ✨ brilho suave que sobe do topo, na cor da etapa */
.passo::before{content:'';position:absolute;inset:-1px -1px auto -1px;height:62%;pointer-events:none;
  background:linear-gradient(180deg,var(--c),transparent);opacity:.13;}
.passo:hover{border-color:rgba(255,255,255,.22);transform:translateY(-5px);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 18px 40px -20px var(--c), 0 0 0 1px var(--c);}
.passo:hover::before{opacity:.2;}
/* seta entre as etapas */
.passo:not(:last-child)::after{content:'';position:absolute;right:-8px;top:50%;
  width:0;height:0;border-left:5px solid var(--linha);
  border-top:4px solid transparent;border-bottom:4px solid transparent;z-index:2;}
.pn{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--fraco);letter-spacing:.06em;
  height:13px;}
/* 📏 rótulo e número ocupam alturas fixas, então TODOS os números do funil
   ficam na mesma linha de visão, independentemente da altura da coluna */
.plbl{font-size:10px;font-weight:750;color:var(--dim);letter-spacing:.045em;text-transform:uppercase;
  line-height:1.3;margin-top:8px;height:26px;display:flex;align-items:flex-start;}
.pval{font-family:var(--mono);font-size:27px;font-weight:680;letter-spacing:-1.5px;line-height:1;
  height:30px;display:flex;align-items:center;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 26px currentColor;filter:saturate(1.15);}
.pinfo{display:contents;}
.pdet{font-size:10px;color:var(--fraco);margin-top:7px;line-height:1.45;}
/* o que sobra da altura vai para o rodapé da coluna, dando a forma do funil */
.pfundo{margin-top:auto;}
/* 🔻 barra que desce da esquerda para a direita, ancorada na mesma base */
.barras{display:flex;align-items:flex-end;gap:5px;margin-top:9px;height:96px;}
.barra-col{flex:1 1 0;min-width:126px;position:relative;border-radius:9px 9px 0 0;
  background:linear-gradient(180deg,var(--c),transparent 130%);
  border:1px solid var(--c);border-bottom:none;opacity:.55;transition:.22s;
  box-shadow:0 -10px 30px -14px var(--c);}
.barra-col:hover{opacity:.9;box-shadow:0 -12px 34px -10px var(--c);}
.barra-col span{position:absolute;top:-17px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--dim);}
.base-funil{height:2px;background:linear-gradient(90deg,var(--linha),transparent);border-radius:2px;}
.ptaxa{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:5px;margin-top:8px;align-self:flex-start;}
.t-bom{background:rgba(52,211,153,.13);color:var(--verde);}
.t-medio{background:rgba(251,191,36,.13);color:var(--ambar);}
.t-ruim{background:rgba(251,113,133,.13);color:var(--vermelho);}
.split{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}
.chip{background:rgba(0,0,0,.32);border:1px solid var(--linha);border-radius:5px;padding:2px 6px;
  font-size:9px;font-weight:700;color:var(--dim);white-space:nowrap;}
.chip b{font-family:var(--mono);}

.carregando{text-align:center;padding:80px 20px;color:var(--fraco);font-size:14px;}
.rodape{font-size:10.5px;color:var(--fraco);text-align:center;margin-top:24px;line-height:1.8;}
@media(max-width:760px){
  body{padding:16px 12px 50px;}
  .titulo{font-size:23px;}
  /* no celular o funil rola na horizontal, mantendo a leitura da esquerda para a direita */
  .funil{gap:6px;}
  .passo{min-width:132px;height:auto !important;padding:12px 11px;}
  .pval{font-size:20px;}
  .frente{padding:16px 14px;}
}
</style>
<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  // Papel TV: acesso restrito às telas do sistema TV
  if(localStorage.getItem('tf_role')==='tv'&&location.pathname.indexOf('/tv')!==0){
    location.replace('/tv-adm');return;
  }
  var _f=window.fetch;
  window.fetch=function(u,o){
    var isApi=false;
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        isApi=true;o=o||{};
        var kk=localStorage.getItem('tf_key')||'';
        if(o.headers&&typeof o.headers.set==='function'){o.headers.set('x-tf-key',kk);}
        else{o.headers=Object.assign({},o.headers||{},{'x-tf-key':kk});}
      }
    }catch(e){}
    var p=_f.call(this,u,o);
    if(isApi){
      p=p.then(function(r){
        if(r&&r.status===401&&!window.__tfHealed){
          window.__tfHealed=true;
          localStorage.removeItem('tf_key');
          location.replace('/login?next='+encodeURIComponent(location.pathname));
        }
        return r;
      });
    }
    return p;
  };
  // Navegação/downloads para /api/ (links e window.open) também levam a chave
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a'):null;
    if(a){
      var hu=a.getAttribute('href')||'';
      if(hu.indexOf('/api/')>-1&&hu.indexOf('k=')===-1){
        a.setAttribute('href',hu+(hu.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||''));
      }
    }
  },true);
  var _wo=window.open;
  window.open=function(u){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('k=')===-1){
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||'');
        arguments[0]=u;
      }
    }catch(e){}
    return _wo.apply(window,arguments);
  };
})();
</script>
</head>
<body>

<div class="topo">
  <div>
    <div class="titulo">Funil de <em>Resultado</em></div>
    <div class="sub" id="carimbo">carregando…</div>
  </div>
  <a href="/adm" class="voltar" style="margin-left:auto;">← Menu</a>
</div>

<div class="filtros">
  <button class="fbtn on" id="f-dia"   onclick="periodo('dia')">Hoje</button>
  <button class="fbtn"    id="f-semana" onclick="periodo('semana')">Semana</button>
  <button class="fbtn"    id="f-mes"    onclick="periodo('mes')">Mês</button>
  <input type="date" id="dt-de"  class="data-in">
  <input type="date" id="dt-ate" class="data-in">
  <button class="fbtn" onclick="periodo('personalizado')">Aplicar</button>
  <button class="fbtn" onclick="verFontes()">📖 De onde vêm os números</button>
  <button class="fbtn" onclick="carregar()" style="margin-left:auto;">↻</button>
</div>

<div id="erro-geral" style="display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);
  border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:12.5px;color:#f87171;
  font-family:var(--mono);white-space:pre-wrap;"></div>

<div id="conteudo"><div class="carregando">⏳ montando o funil…</div></div>

<div class="rodape" id="rodape"></div>

<script>
// 🔊 qualquer falha de script aparece na tela, em vez de deixar a página vazia
window.onerror = function(msg, arq, lin, col){
  var el = document.getElementById('erro-geral');
  if(el){ el.style.display='block';
    el.textContent = '🚨 erro na página: ' + msg + '\n' + (arq||'') + ' linha ' + lin + ':' + col; }
  return false;
};
var _per = 'dia';
function periodo(p){
  _per = p;
  ['dia','semana','mes'].forEach(function(x){
    var b=document.getElementById('f-'+x); if(b) b.classList.toggle('on', x===p);
  });
  carregar();
}

function verFontes(){
  var r = window._kpi; if(!r || !r.FONTES){ alert('carregue o painel primeiro'); return; }
  var F = r.FONTES, dg = r.DIAGNOSTICO || {};
  var linha = function(t,v){ return '<div style="margin-top:13px;">'
    + '<div style="font-size:11px;font-weight:750;color:var(--a1);letter-spacing:.05em;text-transform:uppercase;">'+t+'</div>'
    + '<div style="font-size:12px;color:var(--dim);margin-top:4px;line-height:1.65;">'+esc(v)+'</div></div>'; };
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;'
    + 'align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px);';
  ov.innerHTML = '<div style="background:var(--painel);border:1px solid var(--linha);border-radius:18px;'
    + 'padding:24px 26px;max-width:600px;width:100%;max-height:86vh;overflow-y:auto;">'
    + '<div style="font-size:19px;font-weight:800;letter-spacing:-.6px;">📖 De onde vêm os números</div>'
    + '<div style="background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.25);border-radius:11px;'
      + 'padding:12px 14px;margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.7;">'
      + 'conta de anúncios: <b>'+esc(dg.contaDeAnuncios||'—')+'</b><br>'
      + 'mensagens lidas no histórico: <b>'+(dg.eventosLidos||0)+'</b><br>'
      + 'conversas novas no período: <b>'+(dg.conversasNoPeriodo||0)+'</b></div>'
    + linha('Investimento', F.investimento)
    + linha('Conversas iniciadas', F.conversas)
    + linha('ADM ou TV', F.conversasPorFrente)
    + linha('Fichas criadas', F.fichas)
    + linha('Logística', F.logistica)
    + linha('Orçamentos', F.orcamentos)
    + linha('Aprovados', F.aprovados)
    + linha('Faturamento', F.faturamento)
    + '<div style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);border-radius:11px;'
      + 'padding:12px 14px;margin-top:16px;font-size:11.5px;color:var(--ambar);line-height:1.7;">⚠️ '+esc(F.atencao)+'</div>'
    + '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="width:100%;margin-top:18px;'
      + 'background:rgba(255,255,255,.06);border:1px solid var(--linha);border-radius:10px;padding:11px;'
      + 'color:var(--txt);font-weight:700;cursor:pointer;font-size:13px;">Fechar</button>'
  + '</div>';
  document.body.appendChild(ov);
}
function moeda(v){
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function classePct(p){ return p>=60?'bom':p>=30?'medio':'ruim'; }
function corPct(p){ return p>=60?'var(--verde)':p>=30?'var(--ambar)':'var(--vermelho)'; }
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }

// 🔻 cada passo do funil é mais estreito que o anterior
// ▶️ cada coluna é mais baixa que a anterior — o funil corre da esquerda para a direita
function passo(n, lbl, val, cor, det, taxa, taxaLbl, altura){
  var cls = taxa==null ? '' : (taxa>=60?'t-bom':taxa>=30?'t-medio':'t-ruim');
  return '<div class="passo" style="--c:'+cor+'">'
    + '<span class="pn">'+n+'</span>'
    + '<div class="plbl">'+lbl+'</div>'
    + '<div class="pval" style="color:'+cor+'">'+val+'</div>'
    + (taxa!=null ? '<span class="ptaxa '+cls+'">'+taxa+'% ▸</span>' : '')
    + (det ? '<div class="pdet">'+det+'</div>' : '')
  + '</div>';
}

function blocoFrente(nome, d, cor, etiqueta){
  var roiCor = d.retorno>=3?'var(--verde)':d.retorno>=1?'var(--ambar)':'var(--vermelho)';
  var L = [268, 250, 233, 216, 199, 182, 165, 148];   // altura decrescente, em pixels
  var chip = function(v,t,c){ return '<span class="chip"><b style="color:'+c+'">'+v+'</b> '+t+'</span>'; };
  return '<div class="frente">'
    + '<div class="fhead">'
      + '<span class="fnome" style="color:'+cor+'">'+nome+'</span>'
      + '<span class="ftag" style="background:'+cor.replace(')',',.13)').replace('var(--','rgba(0,0,0,0')+';color:'+cor+';background:rgba(255,255,255,.05)">'+etiqueta+'</span>'
      + '<div class="froi"><b style="color:'+roiCor+'">'
        + (d.retorno? d.retorno.toFixed(2).replace('.',',')+'×' : '—')
      + '</b><span>retorno</span></div>'
    + '</div>'
    + '<div class="funil">'
      + passo('01','Investimento', moeda(d.investimento), 'var(--a1)',
          d.investimento ? 'verba gasta na Meta no período' : 'sem gasto no período',
          null, null, L[0])
      + passo('02','Conversas iniciadas', d.conversas, 'var(--a2)',
          d.custoPorConversa ? '<b style="color:var(--a2)">'+moeda(d.custoPorConversa)+'</b> por conversa'
            : (d.conversas ? 'iniciadas pelo anúncio' : 'nenhuma conversa nova'),
          null, null, L[1])
      + passo('03','Fichas criadas', d.fichas, 'var(--a3)',
          d.custoPorFicha ? moeda(d.custoPorFicha)+' por ficha' : '',
          d.conversaParaFicha, null, L[2])
      + passo('04','Logística criada', d.logistica.total, 'var(--a4)',
          '<div class="split">'+chip(d.logistica.bot,'bot '+d.logistica.pctBot+'%','var(--verde)')
          + chip(d.logistica.manual,'manual '+(100-d.logistica.pctBot)+'%','var(--dim)')+'</div>',
          d.fichaParaLogistica, null, L[3])
      + passo('05','Orçamentos', d.orcamentos, 'var(--a5)', 'diagnóstico registrado',
          d.logisticaParaOrcamento, null, L[4])
      + passo('06','Passaram por aprovado', d.aprovados.total, 'var(--a6)',
          '<div class="split">'+chip(d.aprovados.bot,'bot '+d.aprovados.pctBot+'%','var(--verde)')
          + chip(d.aprovados.manual,'manual '+(100-d.aprovados.pctBot)+'%','var(--dim)')+'</div>',
          d.orcamentoParaAprovado, null, L[5])
      + passo('07','Faturamento', moeda(d.faturamento), 'var(--verde)',
          d.ticketMedio ? 'ticket médio '+moeda(d.ticketMedio) : '', null, null, L[6])
      + passo('08','Custo por aprovado', d.custoPorAprovado?moeda(d.custoPorAprovado):'—', 'var(--ambar)',
          d.custoPorAprovado && d.ticketMedio
            ? ((d.custoPorAprovado/d.ticketMedio*100).toFixed(0))+'% do ticket médio' : '',
          null, null, L[7])
    + '</div>'
    + '<div class="barras">'
      + [d.investimento, d.conversas, d.fichas, d.logistica.total,
         d.orcamentos, d.aprovados.total, d.faturamento, d.custoPorAprovado]
        .map(function(v, ix){
          var cores = ['var(--a1)','var(--a2)','var(--a3)','var(--a4)',
                       'var(--a5)','var(--a6)','var(--verde)','var(--ambar)'];
          var alt = [96, 85, 74, 64, 54, 44, 35, 26][ix];
          return '<div class="barra-col" style="height:'+alt+'px;--c:'+cores[ix]+'"></div>';
        }).join('')
    + '</div>'
    + '<div class="base-funil"></div>'
  + '</div>';
}

async function carregar(){
  var cx = document.getElementById('conteudo');
  cx.innerHTML = '<div class="carregando">⏳ montando o funil…</div>';
  var qs = 'periodo='+_per;
  if(_per==='personalizado'){
    var de=(document.getElementById('dt-de')||{}).value, ate=(document.getElementById('dt-ate')||{}).value;
    if(!de||!ate){ alert('Escolha as duas datas.'); return; }
    qs += '&de='+de+'&ate='+ate;
  }
  var r = null, diag = '';
  try {
    var resp = await fetch('/api/kpis?'+qs);
    diag = 'HTTP ' + resp.status;
    var txt = await resp.text();
    try { r = JSON.parse(txt); }
    catch(e){ diag += ' · resposta não é JSON: ' + txt.slice(0,180); }
  } catch(e){ diag = 'falha na conexão: ' + e.message; }
  if(!r || !r.ok){
    cx.innerHTML = '<div class="carregando" style="color:var(--vermelho)">'
      + 'não consegui carregar os indicadores<br>'
      + '<span style="font-size:12px;font-family:var(--mono);color:var(--dim)">'
      + esc(diag) + (r&&r.error?' · '+esc(r.error):'') + '</span><br>'
      + '<button class="fbtn" style="margin-top:14px" onclick="carregar()">↻ tentar de novo</button>'
      + '</div>';
    return;
  }
  window._kpi = r;
  document.getElementById('carimbo').textContent = (r.periodo.rotulo||'') + ' · atualizado ' + (r.geradoEm||'');
  var t = r.TOTAL||{};
  var roiCor = t.retorno>=3?'var(--verde)':t.retorno>=1?'var(--ambar)':'var(--vermelho)';
  var dg = r.DIAGNOSTICO || {};
  var avisos = [];
  if(!dg.tokenDaMetaConfigurado) avisos.push('o investimento não aparece porque a conta de anúncios não está conectada');
  if(!dg.eventosLidos) avisos.push('as conversas não aparecem porque não há histórico de mensagens no período');
  cx.innerHTML = (avisos.length ? '<div style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);'
      + 'border-radius:12px;padding:12px 15px;margin-bottom:18px;font-size:12px;color:var(--ambar);line-height:1.7;">⚠️ '
      + avisos.map(esc).join('<br>⚠️ ') + '</div>' : '')
    + '<div class="resumo">'
    + '<div class="rcard" style="--c:var(--a1)"><div class="rlbl">Investimento</div>'
      + '<div class="rval" style="color:var(--a1)">'+moeda(t.investimento)+'</div>'
      + '<div class="rsub">'+esc(r.fonteInvestimento||'')+'</div></div>'
    + '<div class="rcard" style="--c:var(--verde)"><div class="rlbl">Faturamento aprovado</div>'
      + '<div class="rval" style="color:var(--verde)">'+moeda(t.faturamento)+'</div>'
      + '<div class="rsub">'+(t.aprovados||0)+' cliente(s) aprovado(s)</div></div>'
    + '<div class="rcard" style="--c:var(--a4)"><div class="rlbl">Custo por aprovado</div>'
      + '<div class="rval" style="color:var(--a4)">'
        + (t.aprovados&&t.investimento?moeda(t.investimento/t.aprovados):'—')+'</div>'
      + '<div class="rsub">média das duas frentes</div></div>'
    + '<div class="rcard" style="--c:'+roiCor+'"><div class="rlbl">Retorno</div>'
      + '<div class="rval" style="color:'+roiCor+'">'+(t.retorno?t.retorno.toFixed(2).replace('.',',')+'×':'—')+'</div>'
      + '<div class="rsub">faturamento ÷ investimento</div></div>'
  + '</div>'
  + blocoFrente('ADM', r.ADM, 'var(--a1)', 'linha branca')
  + blocoFrente('TV', r.TV, 'var(--a6)', 'televisores');
  document.getElementById('rodape').innerHTML =
    'conversas: ' + esc(r.origemDasConversas || '—') + '<br>'
    + 'aprovados: quem passou pela fase no período, mesmo que já tenha avançado depois<br>'
    + 'investimento: gasto real das datas, incluindo campanhas já encerradas<br>'
    + 'período de ' + esc(r.periodo.de) + ' a ' + esc(r.periodo.ate);
}

// datas padrão
(function(){
  var hoje = new Date(Date.now()-3*3600000).toISOString().slice(0,10);
  var de = document.getElementById('dt-de'), ate = document.getElementById('dt-ate');
  if(de) de.value = hoje.slice(0,8)+'01';
  if(ate) ate.value = hoje;
})();
carregar();
setInterval(carregar, 300000);
</script>
</body>
</html>
