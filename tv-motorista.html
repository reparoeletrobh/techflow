<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏍️ Motoristas — Rotas TV</title>
<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  var _f=window.fetch;
  window.fetch=function(u,o){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        var kk=localStorage.getItem('tf_key')||'';
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(kk);
      }
    }catch(e){}
    return _f.call(this,u,o);
  };
})();
</script>
<style>
:root{--bg:#0e1013;--surface:#16191e;--line:#262b33;--txt:#f0f2f5;--dim:#8b93a3;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto;}
h1{font-size:18px;font-weight:900;margin-bottom:4px;}
.sub{font-size:12.5px;color:var(--dim);margin-bottom:16px;}
.mot{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;text-decoration:none;color:var(--txt);transition:transform .1s;}
.mot:active{transform:scale(.98);}
.mot .nome{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;}
.mot .stats{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--dim);flex-wrap:wrap;}
.mot .stats b{font-size:16px;display:block;}
.late{color:#f87171;}
.regs{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;}
.reg-pill{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:99px;}
.carregando{color:var(--dim);font-size:12px;margin-top:8px;}
a.volta{color:var(--dim);text-decoration:none;font-size:13px;}
</style>
</head>
<body>
<h1>🏍️ Motoristas — Rotas de Coleta</h1>
<div class="sub">Espelho em tempo real do que cada motorista vê no link dele. Toca no nome para abrir a rota completa. <a class="volta" href="/tv-adm">← voltar</a></div>
<a class="mot" id="m-jhonatan" href="/tv/jhonatan" style="border-left:5px solid #8b5cf6;">
  <div class="nome">🏍️ Jhonatan</div>
  <div class="carregando">Carregando as fichas…</div>
</a>
<a class="mot" id="m-wilde" href="/tv/wilde" style="border-left:5px solid #06b6d4;">
  <div class="nome">🏍️ Wilde</div>
  <div class="carregando">Carregando as fichas…</div>
</a>
<a class="mot" id="m-eduardo" href="/tv/eduardo" style="border-left:5px solid #f59e0b;">
  <div class="nome">🏍️ Eduardo</div>
  <div class="carregando">Carregando as fichas…</div>
</a>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
async function carrega(nome){
  var el=document.getElementById('m-'+nome.toLowerCase());
  try{
    var r=await fetch('/api/tv-logistica?action=rota-fichas&m='+encodeURIComponent(nome)).then(function(x){return x.json();});
    if(!r.ok)throw 0;
    var fichas=r.fichas,REG=r.regioes;
    var atras=fichas.filter(function(f){return (Date.now()-new Date(f.movedAt||0).getTime())/3600000>48;}).length;
    var contat=fichas.filter(function(f){return f.primeiroContatoEm;}).length;
    var grupos={};fichas.forEach(function(f){grupos[f.regiao]=(grupos[f.regiao]||0)+1;});
    var pills=Object.keys(grupos).sort(function(a,b){return grupos[b]-grupos[a];}).map(function(rg){
      var R=REG[rg]||{nome:rg,cor:'#6b7280'};
      return '<span class="reg-pill" style="background:'+R.cor+'22;color:'+R.cor+';border:1px solid '+R.cor+'55;">'+esc(R.nome)+' '+grupos[rg]+'</span>';
    }).join('');
    el.querySelector('.carregando').outerHTML=
      '<div class="stats">'+
        '<span><b>'+fichas.length+'</b>para coletar</span>'+
        '<span><b>'+contat+'</b>já contatadas</span>'+
        '<span class="'+(atras?'late':'')+'"><b>'+atras+'</b>em atraso (2d+)</span>'+
      '</div>'+(pills?'<div class="regs">'+pills+'</div>':'');
  }catch(e){
    var c=el.querySelector('.carregando');if(c)c.textContent='Erro ao carregar';
  }
}
carrega('Jhonatan');carrega('Wilde');carrega('Eduardo');
carregarRelatorio();

async function carregarRelatorio(dias){
  dias=dias||30;
  var el=document.getElementById('rel-motoristas');
  if(!el){
    el=document.createElement('div');
    el.id='rel-motoristas';
    el.style.cssText='margin-top:22px;';
    document.body.appendChild(el);
  }
  el.innerHTML='<div style="color:#8b93a3;font-size:12px;padding:14px;text-align:center;">📊 carregando o relatório…</div>';
  var r=await fetch('/api/tv-logistica?action=relatorio-motoristas&dias='+dias).then(function(x){return x.json();}).catch(function(){return null;});
  if(!r||!r.ok){el.innerHTML='';return;}
  var s=r.resumo||{};
  var per=[[7,'7 dias'],[30,'30 dias'],[90,'90 dias']].map(function(p){
    return '<button onclick="carregarRelatorio('+p[0]+')" style="flex:1;padding:7px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:800;'
      +(dias===p[0]?'background:#8b5cf6;color:#fff;border:1px solid #8b5cf6;':'background:#12161d;color:#8b93a3;border:1px solid #242b39;')+'">'+p[1]+'</button>';
  }).join('');
  var h='<div style="background:#12161d;border:1px solid #242b39;border-radius:14px;padding:14px;">'
    +'<div style="font-size:14px;font-weight:900;margin-bottom:10px;">📊 Relatório dos motoristas</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:12px;">'+per+'</div>'
    +'<div style="display:flex;gap:14px;flex-wrap:wrap;background:#0c1016;border-radius:10px;padding:11px;margin-bottom:12px;">'
      +'<div><div style="font-size:19px;font-weight:800;color:#4ade80;">'+(s.coletas||0)+'</div><div style="font-size:9px;color:#8b93a3;font-weight:800;">COLETAS</div></div>'
      +'<div><div style="font-size:19px;font-weight:800;">'+(s.coletasPorDia||0)+'</div><div style="font-size:9px;color:#8b93a3;font-weight:800;">POR DIA</div></div>'
      +'<div><div style="font-size:19px;font-weight:800;color:#60a5fa;">'+(s.horasMediasAteColeta!=null?s.horasMediasAteColeta+'h':'—')+'</div><div style="font-size:9px;color:#8b93a3;font-weight:800;">ATÉ COLETAR</div></div>'
      +'<div><div style="font-size:19px;font-weight:800;color:'+((s.taxaSucessoGeral||'').replace('%','')>=85?'#4ade80':'#f59e0b')+';">'+(s.taxaSucessoGeral||'—')+'</div><div style="font-size:9px;color:#8b93a3;font-weight:800;">SUCESSO</div></div>'
      +(s.cancelamentos?'<div><div style="font-size:19px;font-weight:800;color:#f87171;">'+s.cancelamentos+'</div><div style="font-size:9px;color:#8b93a3;font-weight:800;">CANCELADAS</div></div>':'')
      +(s.remarcacoes?'<div><div style="font-size:19px;font-weight:800;color:#fbbf24;">'+s.remarcacoes+'</div><div style="font-size:9px;color:#8b93a3;font-weight:800;">REMARCADAS</div></div>':'')
    +'</div>';
  h+=(r.detalhe||[]).map(function(m,i){
    var medalha=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':'&nbsp;&nbsp;'));
    return '<div style="border-top:1px solid #1e232c;padding:9px 0;">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;">'
        +'<b style="font-size:13px;">'+medalha+' '+esc(m.motorista)+'</b>'
        +'<span style="font-size:15px;font-weight:800;color:#4ade80;">'+m.coletas+'</span></div>'
      +'<div style="font-size:10.5px;color:#8b93a3;margin-top:3px;">'
        +m.mediaPorDiaAtivo+'/dia em '+m.diasAtivos+' dia(s)'
        +(m.horasMediasAteColeta!=null?' · ⏱ '+m.horasMediasAteColeta+'h até coletar':'')
        +(m.taxaSucesso!=null?' · ✅ '+m.taxaSucesso+'% sucesso':'')
        +(m.cancelamentos?' · <span style="color:#f87171;">❌ '+m.cancelamentos+'</span>':'')
        +(m.remarcacoes?' · <span style="color:#fbbf24;">🔁 '+m.remarcacoes+'</span>':'')
        +(m.naRotaAgora?' · <span style="color:#60a5fa;">🚚 '+m.naRotaAgora+' na rota</span>':'')
      +'</div></div>';
  }).join('');
  if(r.observacao)h+='<div style="font-size:10px;color:#5a6270;margin-top:10px;line-height:1.5;">'+esc(r.observacao)+'</div>';
  h+='</div>';
  el.innerHTML=h;
}
setInterval(function(){if(!document.hidden){carrega('Jhonatan');carrega('Wilde');carrega('Eduardo');}},90000);
</script>
</body>
</html>
