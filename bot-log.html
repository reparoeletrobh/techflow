<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot — Negociação e Consumo</title>
<style>
:root{--bg:#07090d;--painel:#0d1117;--card:#12161d;--linha:#1e2430;--txt:#f0f2f5;
  --dim:#8b93a3;--fraco:#5a6270;--verde:#34d399;--ambar:#fbbf24;--vermelho:#f87171;
  --azul:#60a5fa;--roxo:#a78bfa;--mono:ui-monospace,'SF Mono',Menlo,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:20px 18px 60px;-webkit-font-smoothing:antialiased;}
.topo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.titulo{font-size:24px;font-weight:800;letter-spacing:-.6px;}
.sub{font-size:11.5px;color:var(--fraco);font-family:var(--mono);margin-top:5px;}
.abas{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.aba{background:rgba(255,255,255,.03);border:1px solid var(--linha);border-radius:10px;
  padding:9px 18px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;}
.aba.on{background:rgba(96,165,250,.15);border-color:var(--azul);color:var(--azul);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin-bottom:20px;}
.c{background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--linha);border-radius:14px;padding:15px 17px;}
.c .n{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;letter-spacing:-1px;}
.c .l{font-size:10px;color:var(--fraco);font-weight:750;letter-spacing:.07em;
  text-transform:uppercase;margin-top:6px;}
.sec{background:var(--painel);border:1px solid var(--linha);border-radius:15px;
  padding:16px 18px;margin-bottom:14px;}
.sec h3{font-size:13px;font-weight:800;margin-bottom:10px;letter-spacing:-.2px;}
.lista{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.85;
  max-height:340px;overflow-y:auto;white-space:pre-wrap;}
.barra{display:flex;align-items:center;gap:9px;margin:5px 0;}
.barra .nome{font-size:11.5px;color:var(--dim);min-width:150px;}
.barra .b{flex:1;height:9px;background:#161c26;border-radius:5px;overflow:hidden;}
.barra .b i{display:block;height:100%;border-radius:5px;background:var(--azul);}
.barra .v{font-family:var(--mono);font-size:12px;font-weight:700;min-width:34px;text-align:right;}
.carregando{text-align:center;padding:60px;color:var(--fraco);}
.aviso{border-radius:11px;padding:11px 14px;font-size:12px;line-height:1.7;margin-bottom:12px;}
.aviso.alerta{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.3);color:var(--ambar);}
.aviso.bom{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.3);color:var(--verde);}
@media(max-width:640px){body{padding:14px 12px 50px;}.titulo{font-size:20px;}}
</style>
<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  // Papel TV: acesso restrito às telas do sistema TV
  if(localStorage.getItem('tf_role')==='tv'&&location.pathname.indexOf('/tv')!==0){
    location.replace('/tv-adm');return;
  }
  var _f=window.fetch;
  window.fetch=function(u,o){
    var isApi=false;
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        isApi=true;o=o||{};
        var kk=localStorage.getItem('tf_key')||'';
        if(o.headers&&typeof o.headers.set==='function'){o.headers.set('x-tf-key',kk);}
        else{o.headers=Object.assign({},o.headers||{},{'x-tf-key':kk});}
      }
    }catch(e){}
    var p=_f.call(this,u,o);
    if(isApi){
      p=p.then(function(r){
        if(r&&r.status===401&&!window.__tfHealed){
          window.__tfHealed=true;
          localStorage.removeItem('tf_key');
          location.replace('/login?next='+encodeURIComponent(location.pathname));
        }
        return r;
      });
    }
    return p;
  };
  // Navegação/downloads para /api/ (links e window.open) também levam a chave
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a'):null;
    if(a){
      var hu=a.getAttribute('href')||'';
      if(hu.indexOf('/api/')>-1&&hu.indexOf('k=')===-1){
        a.setAttribute('href',hu+(hu.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||''));
      }
    }
  },true);
  var _wo=window.open;
  window.open=function(u){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('k=')===-1){
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||'');
        arguments[0]=u;
      }
    }catch(e){}
    return _wo.apply(window,arguments);
  };
})();
</script>
</head>
<body>
<div class="topo">
  <div>
    <div class="titulo">🤖 Bot — Negociação e Consumo</div>
    <div class="sub" id="carimbo">carregando…</div>
  </div>
  <a href="/adm" style="margin-left:auto;color:var(--dim);text-decoration:none;font-size:12.5px;
    border:1px solid var(--linha);border-radius:9px;padding:8px 14px;">← Menu</a>
</div>

<div class="abas">
  <button class="aba on" id="ab-neg" onclick="verAba('neg')">📊 Negociação</button>
  <button class="aba" id="ab-con" onclick="verAba('con')">💰 Consumo da IA</button>
  <button class="aba" onclick="carregar()" style="margin-left:auto;">↻</button>
</div>

<div id="conteudo"><div class="carregando">⏳ carregando…</div></div>

<script>
var _aba='neg', _neg=null, _con=null;
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;');}
function verAba(a){
  _aba=a;
  document.getElementById('ab-neg').classList.toggle('on',a==='neg');
  document.getElementById('ab-con').classList.toggle('on',a==='con');
  desenhar();
}
function bloco(t,arr,cor){
  if(!arr||!arr.length) return '';
  return '<div class="sec"><h3 style="color:'+(cor||'var(--txt)')+'">'+t+' ('+arr.length+')</h3>'
    + '<div class="lista">'+arr.map(esc).join('\n')+'</div></div>';
}
function desenhar(){
  var cx=document.getElementById('conteudo');
  if(_aba==='neg'){
    if(!_neg){ cx.innerHTML='<div class="carregando">sem dados</div>'; return; }
    var r=_neg.RESUMO||{}, f=_neg.POR_FASE_DE_VENDA||{};
    var maxF=Math.max.apply(null,Object.values(f).concat([1]));
    cx.innerHTML =
      (r.naoRecebemHa3DiasOuMais ? '<div class="aviso alerta">⚠️ '+r.naoRecebemHa3DiasOuMais
        +' cliente(s) em negociação sem contato há 3 dias ou mais, com a sequência ainda ativa</div>' : '')
      + '<div class="cards">'
      + '<div class="c"><div class="n" style="color:var(--azul)">'+(r.emNegociacao||0)+'</div><div class="l">em negociação</div></div>'
      + '<div class="c"><div class="n" style="color:var(--verde)">'+(r.receberamMensagemHoje||0)+'</div><div class="l">receberam hoje</div></div>'
      + '<div class="c"><div class="n" style="color:var(--ambar)">'+(r.naoRecebemHa3DiasOuMais||0)+'</div><div class="l">parados há 3+ dias</div></div>'
      + '<div class="c"><div class="n" style="color:var(--vermelho)">'+(r.semNenhumContatoDoBot||0)+'</div><div class="l">sem contato do bot</div></div>'
      + '<div class="c"><div class="n" style="color:var(--vermelho)">'+(r.sequenciaEsgotada||0)+'</div><div class="l">sequência esgotada</div></div>'
      + '<div class="c"><div class="n" style="color:var(--verde);font-size:20px">R$ '
        + Number(r.valorEmJogo||0).toLocaleString('pt-BR',{minimumFractionDigits:2})
        + '</div><div class="l">valor em jogo</div></div>'
      + '</div>'
      + '<div class="sec"><h3>Fase da venda</h3>'
      + Object.keys(f).map(function(k){
          var v=f[k]||0;
          return '<div class="barra"><span class="nome">'+esc(k)+'</span>'
            + '<span class="b"><i style="width:'+Math.round(v/maxF*100)+'%"></i></span>'
            + '<span class="v">'+v+'</span></div>';
        }).join('')
      + '</div>'
      + '<div class="sec"><h3>Disparos da sequência</h3><div class="lista">'
      + Object.entries(_neg.POR_DISPARO||{}).sort().map(function(p){return p[0]+': '+p[1];}).join('\n')
      + '</div></div>'
      + bloco('⏳ Sem contato há 3 dias ou mais', _neg.SEM_CONTATO_HA_3_DIAS, 'var(--ambar)')
      + bloco('👤 Sem nenhum contato do bot', _neg.SEM_NENHUM_CONTATO, 'var(--vermelho)')
      + bloco('✅ Receberam mensagem hoje', _neg.RECEBERAM_HOJE, 'var(--verde)')
      + bloco('⚠️ Sequência esgotada', _neg.SEQUENCIA_ESGOTADA, 'var(--vermelho)')
      + bloco('Todos em negociação', _neg.TODOS, 'var(--dim)');
  } else {
    if(!_con){ cx.innerHTML='<div class="carregando">sem dados</div>'; return; }
    var t=_con.TOTAIS||{};
    cx.innerHTML =
      '<div class="aviso '+(String(_con.LEITURA||'').indexOf('⚠️')===0?'alerta':'bom')+'">'
        + esc(_con.LEITURA||'')+'</div>'
      + '<div class="cards">'
      + '<div class="c"><div class="n" style="color:var(--azul)">'+(t.chamadas||0)+'</div><div class="l">mensagens processadas</div></div>'
      + '<div class="c"><div class="n" style="color:var(--roxo)">'+(t.mediaTokensPorMensagem||0)+'</div><div class="l">tokens por mensagem</div></div>'
      + '<div class="c"><div class="n" style="color:var(--verde)">'+esc(t.aproveitamentoDoCache||'0%')+'</div><div class="l">cache aproveitado</div></div>'
      + '<div class="c"><div class="n" style="color:var(--ambar);font-size:21px">R$ '
        + Number(t.custoBRL||0).toLocaleString('pt-BR',{minimumFractionDigits:2})
        + '</div><div class="l">custo no período</div></div>'
      + '<div class="c"><div class="n" style="font-size:18px">'+(t.tokensEntrada||0).toLocaleString('pt-BR')+'</div><div class="l">tokens de entrada</div></div>'
      + '<div class="c"><div class="n" style="font-size:18px">'+(t.tokensSaida||0).toLocaleString('pt-BR')+'</div><div class="l">tokens de saída</div></div>'
      + '</div>'
      + bloco('Consumo por dia', _con.POR_DIA, 'var(--azul)')
      + bloco('Por origem', _con.POR_ORIGEM, 'var(--dim)')
      + '<div class="sec"><div style="font-size:11.5px;color:var(--fraco);line-height:1.7;">'
      + esc(_con.observacao||'')+'</div></div>';
  }
}
async function carregar(){
  document.getElementById('conteudo').innerHTML='<div class="carregando">⏳ carregando…</div>';
  try{
    var a=await fetch('/api/wa-bot?action=painel-negociacao').then(function(x){return x.json();});
    if(a&&a.ok)_neg=a;
  }catch(e){}
  try{
    var b=await fetch('/api/wa-bot?action=consumo-ia&dias=7').then(function(x){return x.json();});
    if(b&&b.ok)_con=b;
  }catch(e){}
  document.getElementById('carimbo').textContent='atualizado '+
    new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
  desenhar();
}
carregar();
setInterval(carregar,180000);
</script>
</body>
</html>
