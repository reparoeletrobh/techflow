<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila de Garantia TV</title>
<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  var _f=window.fetch;
  window.fetch=function(u,o){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        var kk=localStorage.getItem('tf_key')||'';
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(kk);
      }
    }catch(e){}
    return _f.call(this,u,o);
  };
})();
</script>
<style>
:root{--bg:#0e1013;--surface:#16191e;--line:#262b33;--txt:#f0f2f5;--dim:#8b93a3;--azul:#2563eb;--fm:'SF Mono',ui-monospace,monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;max-width:760px;margin:0 auto;padding-bottom:60px;}
h1{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;}
.topmenu{display:flex;gap:8px;margin:12px 0 16px;}
.topmenu a{text-decoration:none;font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:9px;border:1px solid var(--line);color:var(--dim);}
.topmenu a.ativa{background:rgba(37,99,235,.15);border-color:#2563eb;color:#60a5fa;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
.kpi b{font-size:21px;display:block;}
.kpi span{font-size:10px;color:var(--dim);font-weight:700;}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--azul);border-radius:13px;padding:13px;margin-bottom:11px;}
.card.resolvida{opacity:.5;border-left-color:#22c55e;}
.nome{font-size:15px;font-weight:900;}
.meta{font-size:11.5px;color:var(--dim);margin-top:2px;}
.relato{font-size:12.5px;background:#101623;border-radius:8px;padding:8px 10px;margin-top:8px;color:#c9d2e0;}
.tempo{display:inline-block;font-family:var(--fm);font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:99px;margin-top:6px;}
.t-ok{background:rgba(37,99,235,.15);color:#60a5fa;}
.t-alerta{background:rgba(245,158,11,.15);color:#fbbf24;}
.t-critico{background:rgba(239,68,68,.2);color:#f87171;animation:pulseT 1.1s infinite;}
@keyframes pulseT{50%{opacity:.55;}}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.b{flex:1;min-width:44%;border:none;border-radius:9px;padding:11px;font-size:12.5px;font-weight:900;cursor:pointer;}
.b-qc{background:#16a34a;color:#fff;}
.b-reabrir{background:#374151;color:#fff;flex:0 0 auto;min-width:auto;padding:8px 12px;font-size:11px;}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:13px;}
.origem{font-size:9.5px;font-weight:800;padding:1px 8px;border-radius:99px;background:rgba(139,147,163,.15);color:var(--dim);margin-left:6px;}
</style>
</head>
<body>
<h1>📺 Garantia TV <span style="font-size:11px;color:var(--dim);font-weight:600;">fila de tratamento</span></h1>
<div class="topmenu">
  <a class="ativa" href="/tv/garantia">🔥 Fila</a>
  <a href="/tv-garantia-v2">📁 Gestão de Garantias</a>
  <a href="/tv">← Menu</a>
</div>
<button onclick="abrirCadastro()" style="width:100%;background:linear-gradient(135deg,#1d4ed8,#2563eb);border:none;border-radius:12px;padding:13px;color:#fff;font-size:14px;font-weight:900;cursor:pointer;margin-bottom:14px;">➕ Cadastrar Garantia</button>
<div id="ov-cadastro" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;padding:16px;">
  <div style="max-width:820px;height:92vh;margin:0 auto;background:#0e1013;border:1px solid #2563eb;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #262b33;">
      <b style="font-size:13px;">➕ Cadastrar Garantia</b>
      <button onclick="fecharCadastro()" style="background:#374151;border:none;border-radius:8px;padding:6px 12px;color:#fff;font-weight:800;cursor:pointer;">✕ Fechar</button>
    </div>
    <iframe id="frame-cadastro" style="flex:1;border:none;width:100%;background:#0e1013;"></iframe>
  </div>
</div>
<div style="margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
  <input id="busca-fila" placeholder="🔍 rastrear cliente por nome ou telefone…"
    style="flex:1;min-width:230px;background:#12161d;border:1px solid #2a3140;border-radius:9px;
    padding:9px 12px;color:#f0f2f5;font-size:12.5px;outline:none;"
    onkeydown="if(event.key==='Enter')rastrearNaFila()">
  <button onclick="rastrearNaFila()" style="background:#1d4ed8;border:none;border-radius:9px;
    padding:9px 15px;color:#fff;font-weight:800;cursor:pointer;font-size:12.5px;">Rastrear</button>
</div>
<div id="res-fila"></div>

<div class="kpis">
  <div class="kpi"><b id="k-abertos" style="color:#60a5fa;">—</b><span>ABERTAS</span></div>
  <div class="kpi"><b id="k-hoje" style="color:#4ade80;">—</b><span>RESOLVIDAS HOJE</span></div>
  <div class="kpi"><b id="k-total" style="color:#8b93a3;">—</b><span>RESOLVIDAS TOTAL</span></div>
</div>
<div id="lista"><div class="empty">Carregando…</div></div>
<script>
// ── 🔍 RASTREAR: procura o cliente na fila e na gestão de garantias ──
async function rastrearNaFila(){
  const q = (document.getElementById('busca-fila')||{}).value || '';
  const alvo = document.getElementById('res-fila');
  if(!alvo) return;
  if(!q.trim()){ alvo.innerHTML=''; return; }
  alvo.innerHTML = '<div style="font-size:12px;color:#8b93a3;padding:8px 0;">⏳ procurando…</div>';
  let r = null;
  try { r = await fetch('/api/tv-garantia-v2?action=rastrear&q='+encodeURIComponent(q)).then(x=>x.json()); } catch(e){}
  if(!r){ alvo.innerHTML='<div style="font-size:12px;color:#f87171;padding:8px 0;">erro na busca</div>'; return; }
  const e2 = s => String(s||'').replace(/</g,'&lt;');
  alvo.innerHTML = '<div style="background:#0d1117;border:1px solid #242b39;border-radius:12px;padding:12px 14px;margin-bottom:10px;">'
    + '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;">'
      + '<span style="font-size:12.5px;font-weight:900;color:'+(r.encontrados?'#4ade80':'#fbbf24')+';">'
      + (r.encontrados ? '🔍 '+r.encontrados+' resultado(s) — fila: '+r.naFila+' · gestão: '+r.naGestao
                       : '🔍 nada encontrado para "'+e2(q)+'"')+'</span>'
      + '<button style="margin-left:auto;background:#374151;border:none;border-radius:7px;padding:4px 10px;'
      + 'color:#fff;font-weight:700;cursor:pointer;font-size:11px;" '
      + 'onclick="document.getElementById(\'res-fila\').innerHTML=\'\';document.getElementById(\'busca-fila\').value=\'\'">✕</button>'
    + '</div>'
    + ((r.L&&r.L.length)
      ? '<div style="background:#0f1319;border:1px solid #1e2228;border-radius:9px;padding:9px 11px;margin-top:8px;'
        + 'font-family:ui-monospace,monospace;font-size:10.5px;color:#c9ced6;line-height:1.9;max-height:280px;overflow-y:auto;">'
        + r.L.map(e2).join('<br>')+'</div>' : '')
  + '</div>';
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTel(t){var d=String(t||'').replace(/\D/g,'');if(d.indexOf('55')===0)d=d.slice(2);
  if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return t||'';}
function tempoAberto(iso){
  var h=(Date.now()-new Date(iso).getTime())/3600000;
  if(h<1)return {txt:Math.round(h*60)+' min aberta',cls:'t-ok'};
  if(h<24)return {txt:h.toFixed(0)+'h aberta',cls:h>=8?'t-alerta':'t-ok'};
  var d=Math.floor(h/24);
  return {txt:d+'d '+Math.round(h%24)+'h aberta',cls:d>=2?'t-critico':'t-alerta'};
}
var _d=null;
async function load(){
  try{
    var r=await fetch('/api/tv-garantia-v2?action=fila-load').then(function(x){return x.json();});
    if(!r.ok)throw 0;
    _d=r;render();
  }catch(e){document.getElementById('lista').innerHTML='<div class="empty">Erro ao carregar</div>';}
}
function render(){
  document.getElementById('k-abertos').textContent=_d.abertos;
  document.getElementById('k-hoje').textContent=_d.resolvidosHoje;
  document.getElementById('k-total').textContent=_d.totalResolvidos;
  var el=document.getElementById('lista');
  if(!_d.itens.length){el.innerHTML='<div class="empty">🎉 Nenhuma garantia na fila!</div>';return;}
  el.innerHTML=_d.itens.map(function(g){
    var res=g.status==='resolvido';
    var t=tempoAberto(g.criadoEm);
    return '<div class="card'+(res?' resolvida':'')+'">'+
      '<div class="nome">'+esc(g.nome)+'<span class="origem">'+esc(g.origem)+'</span></div>'+
      '<div class="meta">'+(g.telefone?'📞 '+fmtTel(g.telefone)+' · ':'')+esc(g.equipamento||'')+'</div>'+
      (g.relato?'<div class="relato">'+esc(g.relato)+'</div>':'')+
      (res
        ?'<div class="tempo" style="background:rgba(34,197,94,.15);color:#4ade80;">✅ resolvida → '+(g.destino==='video'?'🎬 vídeo':'✅ controle de qualidade')+'</div>'+
         '<div class="acts"><button class="b b-reabrir" onclick="reabrir(\''+g.id+'\')">↩ reabrir</button></div>'
        :'<div class="tempo '+t.cls+'">⏱ '+t.txt+'</div>'+
         '<div class="acts">'+
           '<button class="b b-qc" onclick="resolver(\''+g.id+'\',\'qc\')">✅ Controle de Qualidade</button>'+
         '</div>')+
    '</div>';
  }).join('');
}
// 🔬 mandar para o controle de qualidade pede o técnico que executou a garantia
async function resolver(id,destino){
  if(destino === 'qc'){ return escolherTecnicoQC(id); }
  return enviarResolucao(id, destino, null);
}
async function escolherTecnicoQC(id){
  var tecs = [];
  try {
    var eq = await fetch('/api/qualidade?action=equipe').then(function(x){return x.json();});
    if(eq && eq.ok) tecs = eq.tecnicos || [];
  } catch(e){}
  if(!tecs.length) tecs = ['Lucas','Diego','Kassio','Roberto','Carlos','Arthur'];
  var ov = document.createElement('div');
  ov.id = 'ov-tec-qc';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;display:flex;'
    + 'align-items:center;justify-content:center;padding:18px;';
  ov.innerHTML = '<div style="background:#0d1117;border:1px solid #2a3140;border-radius:15px;'
    + 'padding:22px 24px;max-width:400px;width:100%;">'
    + '<div style="font-size:16px;font-weight:900;color:#4ade80;">✅ Controle de Qualidade</div>'
    + '<div style="font-size:12px;color:#8b93a3;margin-top:7px;line-height:1.6;">'
      + 'Quem executou esta garantia? A inspeção entra no controle de qualidade'
      + ' e conta para o técnico.</div>'
    + '<div style="margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
      + tecs.map(function(t){
          return '<button onclick="enviarResolucao(\''+id+'\',\'qc\',\''+String(t).replace(/'/g,"")+'\')" '
            + 'style="background:#1a2030;border:1px solid #2a3140;border-radius:9px;padding:12px 10px;'
            + 'color:#f0f2f5;font-weight:700;cursor:pointer;font-size:13px;">'+String(t).replace(/</g,'&lt;')+'</button>';
        }).join('')
    + '</div>'
    + '<div id="qc-erro" style="font-size:12px;color:#f87171;margin-top:10px;"></div>'
    + '<button onclick="document.getElementById(\'ov-tec-qc\').remove()" '
      + 'style="width:100%;margin-top:14px;background:#374151;border:none;border-radius:9px;'
      + 'padding:11px;color:#fff;font-weight:800;cursor:pointer;font-size:13px;">Cancelar</button>'
  + '</div>';
  document.body.appendChild(ov);
}
async function enviarResolucao(id,destino,tecnico){
  var r=await fetch('/api/tv-garantia-v2?action=fila-resolver',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id,destino:destino,tecnico:tecnico})}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  var ov = document.getElementById('ov-tec-qc');
  if(!r || !r.ok){
    var er = document.getElementById('qc-erro');
    if(er) er.textContent = '🚨 ' + ((r && r.error) || 'não consegui resolver');
    else alert('🚨 ' + ((r && r.error) || 'não consegui resolver'));
    return;
  }
  if(ov) ov.remove();
  if(r.inspecao && r.inspecao.erro){ alert('⚠️ garantia resolvida, mas a inspeção falhou: ' + r.inspecao.erro); }
  else if(r.inspecao && r.inspecao.os){ alert('✅ ' + r.inspecao.os + ' criada para ' + r.inspecao.tecnico); }
  load();
}
async function reabrir(id){
  await fetch('/api/tv-garantia-v2?action=fila-reabrir',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id})}).catch(function(){});
  load();
}
function abrirCadastro(){
  document.getElementById('frame-cadastro').src='/garantia-gestao';
  document.getElementById('ov-cadastro').style.display='block';
}
function fecharCadastro(){
  document.getElementById('ov-cadastro').style.display='none';
  document.getElementById('frame-cadastro').src='about:blank';
  load();
}
load();
setInterval(function(){if(!document.hidden)load();},45000);
</script>
</body>
</html>
