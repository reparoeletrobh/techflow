<!DOCTYPE html>

<script>
/* 🔐 TF-GUARD Fase 1 */
(function(){
  if(location.pathname==='/login'||location.pathname==='/login.html')return;
  var K=localStorage.getItem('tf_key');
  if(!K){location.replace('/login?next='+encodeURIComponent(location.pathname));return;}
  // Papel TV: acesso restrito às telas do sistema TV
  if(localStorage.getItem('tf_role')==='tv'&&location.pathname.indexOf('/tv')!==0){
    location.replace('/tv-adm');return;
  }
  var _f=window.fetch;
  window.fetch=function(u,o){
    var isApi=false;
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('/api/auth')===-1){
        isApi=true;o=o||{};
        var kk=localStorage.getItem('tf_key')||'';
        if(o.headers&&typeof o.headers.set==='function'){o.headers.set('x-tf-key',kk);}
        else{o.headers=Object.assign({},o.headers||{},{'x-tf-key':kk});}
      }
    }catch(e){}
    var p=_f.call(this,u,o);
    if(isApi){
      p=p.then(function(r){
        if(r&&r.status===401&&!window.__tfHealed){
          window.__tfHealed=true;
          localStorage.removeItem('tf_key');
          location.replace('/login?next='+encodeURIComponent(location.pathname));
        }
        return r;
      });
    }
    return p;
  };
  // Navegação/downloads para /api/ (links e window.open) também levam a chave
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a'):null;
    if(a){
      var hu=a.getAttribute('href')||'';
      if(hu.indexOf('/api/')>-1&&hu.indexOf('k=')===-1){
        a.setAttribute('href',hu+(hu.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||''));
      }
    }
  },true);
  var _wo=window.open;
  window.open=function(u){
    try{
      if(typeof u==='string'&&u.indexOf('/api/')>-1&&u.indexOf('k=')===-1){
        u+=(u.indexOf('?')>-1?'&':'?')+'k='+encodeURIComponent(localStorage.getItem('tf_key')||'');
        arguments[0]=u;
      }
    }catch(e){}
    return _wo.apply(window,arguments);
  };
})();
</script>

<script>
var _tel=null,_acaoSug='nenhuma';
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fdt(ts){
  if(!ts)return'';
  var d=new Date(new Date(ts).getTime()-3*3600000);
  var hoje=new Date(Date.now()-3*3600000);
  var dia=d.toISOString().slice(0,10), hj=hoje.toISOString().slice(0,10);
  var ont=new Date(hoje.getTime()-86400000).toISOString().slice(0,10);
  var hora=d.toISOString().slice(11,16);
  if(dia===hj)return hora;
  if(dia===ont)return 'ontem '+hora;
  return dia.slice(8,10)+'/'+dia.slice(5,7)+' '+hora;
}

var ACAO_LBL={cadastrar_logistica:'🚚 Cadastrar em Logística',enviar_orcamento:'📄 Enviar Orçamento',
  desconto_pix:'💠 Desconto Pix',desconto_balcao:'🏪 Desconto Balcão',proposta_troca:'🔄 Proposta de Troca',
  mover_aprovado:'✅ Mover para Aprovado',registrar_reprovacao:'❌ Orçamento Reprovado (reversão)',registrar_conflito:'⚡ Conflito registrado (humano vai ligar)',escalar_humano:'🙋 Escalar para Humano',nenhuma:''};

async function carregarConversas(){
  var el=document.getElementById('lista-conv');
  try{
    var d=await fetch('/api/wa-bot?action=conversas'+(window._verArq?'&arquivadas=1':'')+(window._filtroConv?'&q='+encodeURIComponent(window._filtroConv):'')).then(function(r){return r.json();});
    if(!d.conversas||!d.conversas.length){
      el.innerHTML='<div style="padding:20px;color:#5a6270;font-size:11px;text-align:center;">📭 Nenhuma conversa ainda.<br><br>Configure o webhook na Meta e as mensagens aparecem aqui.</div>';
      return;
    }
    window._ultD=d;renderLista(d);
  }catch(e){el.innerHTML='<div style="padding:20px;color:#ef4444;font-size:11px;">Erro: '+e.message+'</div>';}
}
window._filtroOrc=null;window._orcVivos=null;
async function carregarOrcVivos(){
  try{
    var r=await fetch('/api/wa-bot?action=orcamentos-abertos').then(function(x){return x.json();});
    if(!r.ok)return null;
    window._orcVivos=r.total||0;
    window._orcDados=r;
    return r;
  }catch(e){return null;}
}
async function toggleFiltroOrc(){
  if(window._filtroOrc){
    window._filtroOrc=null;
    var b=document.getElementById('barra-orc'); if(b)b.remove();
    loadKpis();if(window._ultD)renderLista(window._ultD);return;
  }
  var r=window._orcDados||await carregarOrcVivos();
  if(!r||!r.ok)return;
  window._filtroOrc=(r.abertos||[]).map(function(a){return String(a.tel||'').slice(-8);});
  var alvo=document.getElementById('kpi-cards');
  if(alvo&&!document.getElementById('barra-orc')){
    var d=document.createElement('div');
    d.id='barra-orc';
    d.style.cssText='background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);border-radius:10px;padding:8px 11px;margin:8px 0;font-size:11px;line-height:1.5;';
    var ps=r.porSistema||{};
    var sis=Object.keys(ps).map(function(k){return ps[k]+' '+k.toUpperCase();}).join(' · ');
    var parados=(r.abertos||[]).filter(function(a){return (a.horasParado||0)>24;}).length;
    d.innerHTML='<b style="color:#fbbf24;">💰 '+r.total+' no limbo da negociação</b>'
      +'<div style="color:#8b93a3;font-size:10px;margin-top:2px;">'+esc(sis)
      +(parados?' · <span style="color:#fca5a5;">'+parados+' parados há mais de 24h</span>':'')
      +' · toque no cartão de novo para limpar o filtro</div>';
    alvo.parentNode.insertBefore(d,alvo.nextSibling);
  }
  loadKpis();if(window._ultD)renderLista(window._ultD);
}
async function mandarConflito(tel){
  var cc=((window._ultD||{}).conversas||[]).find(function(x){return x.tel===tel;})||{};
  var motivo=prompt('⚡ ENVIAR PARA CONFLITOS BOT\n\nEscreva o que o atendente precisa fazer com este cliente.\nEx: "cliente quer vender a TV — avaliar compra"\n     "insatisfeito com o prazo — ligar e negociar"\n     "quer descartar o equipamento — registrar e encerrar"');
  if(motivo===null)return;
  if(!String(motivo).trim()){alert('Escreva o que precisa ser feito — é o que o atendente vai ler.');return;}
  var r=await fetch('/api/prospeccao?action=criar-conflito',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nome:cc.nome||'Cliente WhatsApp',telefone:String(tel).replace(/\D/g,''),
      equipamento:'',motivo:'[MANUAL] '+motivo})}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  if(r&&r.ok&&r.criado)alert('✅ Enviado para Conflitos Bot');
  else if(r&&r.dedupe)alert('Este cliente já tem um conflito aberto.');
  else alert('Não consegui enviar. Tenta de novo.');
  loadConvs();
}
async function verAprovacoes(){
  var dias=window._kpiDias||1;
  var ov=document.createElement('div');
  ov.id='ov-aprov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;overflow-y:auto;padding:12px;';
  ov.innerHTML='<div style="max-width:760px;margin:0 auto;background:#12161d;border:1px solid #242b39;border-radius:14px;padding:14px;">'
    +'<div style="text-align:center;color:#8b93a3;font-size:12px;padding:20px;">⏳ Montando o relatório…</div></div>';
  document.body.appendChild(ov);
  var r=await fetch('/api/wa-bot?action=aprovacoes-detalhe&dias='+dias).then(function(x){return x.json();}).catch(function(){return null;});
  var rot=dias<=1?'hoje':(dias<=7?'últimos 7 dias':(dias<=30?'últimos 30 dias':'últimos '+dias+' dias'));
  if(!r||!r.ok){ov.querySelector('div').innerHTML='<div style="color:#fca5a5;padding:20px;text-align:center;">Não consegui montar o relatório.</div>';return;}
  var ps=r.porSistema||{};
  var corpo='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<b style="font-size:15px;color:#4ade80;">✅ Aprovações · '+esc(rot)+'</b>'
    +'<button onclick="document.getElementById(\'ov-aprov\').remove()" style="background:#242b39;border:none;border-radius:8px;padding:6px 12px;color:#f0f2f5;font-weight:800;cursor:pointer;">✕</button></div>'
    +'<div style="background:#0c1016;border-radius:9px;padding:10px 12px;margin-bottom:12px;font-family:var(--fm,monospace);font-size:12px;">'
      +'<b style="color:#4ade80;font-size:16px;">'+r.total+'</b> aprovações · <b style="color:#4ade80;">R$ '+Number(r.valorTotal||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+'</b>'
      +'<div style="color:#8b93a3;font-size:10.5px;margin-top:3px;">'+Object.keys(ps).map(function(k){return ps[k]+' '+k;}).join(' · ')+'</div>'
      +(function(){
        var po=r.porOrigem||{};
        var b=po.bot||0,eq=po.equipe||0,ind=po.indefinido||0;
        var pct=r.total?Math.round(b/r.total*100):0;
        return '<div style="margin-top:7px;padding-top:7px;border-top:1px solid #1e232c;font-size:11px;">'
          +'<span style="color:#4ade80;font-weight:800;">🤖 '+b+' pelo bot</span>'
          +' · <span style="color:#a78bfa;font-weight:800;">👤 '+eq+' pela equipe</span>'
          +(ind?' · <span style="color:#8b93a3;">'+ind+' sem registro de origem</span>':'')
          +(r.total?'<div style="color:#5a6270;font-size:10px;margin-top:3px;">o bot fechou '+pct+'% das aprovações do período</div>':'')
        +'</div>';
      })()
      +'<div style="color:#5a6270;font-size:10px;margin-top:5px;line-height:1.4;">O número do cartão conta apenas as do bot. Aprovações anteriores ao registro de origem aparecem como <i>sem registro</i>.</div></div>';
  if(!r.aprovacoes.length){corpo+='<div style="color:#8b93a3;text-align:center;padding:20px;font-size:12.5px;">Nenhuma aprovação neste período.</div>';}
  corpo+=r.aprovacoes.map(function(a){
    var dt=new Date(a.quando);
    var quando=dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return '<div style="border-top:1px solid #1e232c;padding:9px 0;">'
      +'<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;">'
        +'<b style="font-size:13px;">'+esc(a.nome)+' <span style="font-size:10px;color:#5a8dc9;">'+String(a.telefone||'').slice(-4)+'</span>'
        +' <span style="font-size:9px;background:'+(a.sistema==='TV'?'#3b82f622;color:#60a5fa':'#f9731622;color:#fb923c')+';padding:1px 6px;border-radius:6px;font-weight:900;">'+a.sistema+'</span>'
        +(a.origem==='bot'?' <span style="font-size:9px;background:#4ade8022;color:#4ade80;padding:1px 6px;border-radius:6px;font-weight:900;">🤖 BOT</span>'
          :(a.origem==='equipe'?' <span style="font-size:9px;background:#a78bfa22;color:#a78bfa;padding:1px 6px;border-radius:6px;font-weight:900;">👤 EQUIPE</span>':''))+'</b>'
        +'<span style="font-family:var(--fm,monospace);font-size:13px;color:#4ade80;font-weight:800;flex:0 0 auto;">'+(a.valor?'R$ '+Number(a.valor).toLocaleString('pt-BR',{minimumFractionDigits:2}):'—')+'</span></div>'
      +'<div style="font-size:11px;color:#c9ced6;margin-top:2px;">'+esc(a.equipamento||'')+'</div>'
      +'<div style="font-family:var(--fm,monospace);font-size:11px;color:#4ade80;font-weight:700;margin-top:3px;">🕐 aprovado em '+quando
        +(a.dataConfiavel===false?' <span style="color:#f59e0b;">(data aproximada)</span>':'')+'</div>'
      +'<div style="font-family:var(--fm,monospace);font-size:10px;color:#8b93a3;margin-top:1px;">fase atual: '+esc(a.faseAtual)
        +(a.valorCombinadoPeloBot?' · <span style="color:#4ade80;">valor combinado na conversa</span>':'')+'</div>'
      +(a.falaDoCliente?'<div style="margin-top:5px;background:#0c1016;border-left:2px solid #4ade80;border-radius:0 7px 7px 0;padding:6px 9px;font-size:11.5px;color:#dbe1ea;">💬 "'+esc(a.falaDoCliente)+'"</div>':'')
    +'</div>';
  }).join('');
  ov.querySelector('div').innerHTML=corpo;
}
window._buscaTimer=null;
function buscarConversas(v){
  window._filtroConv=String(v||'').toLowerCase();
  if(window._ultD)renderLista(window._ultD);          // resposta imediata no que já está na tela
  clearTimeout(window._buscaTimer);
  window._buscaTimer=setTimeout(function(){loadConvs();},400);  // e busca no servidor
}
window._verArq=false;
async function arquivarConv(tel){
  var c=((window._ultD||{}).conversas||[]).find(function(x){return x.tel===tel;});
  var undo=c&&c.arquivada?'&undo=1':'';
  await fetch('/api/wa-bot?action=arquivar-conversa&tel='+encodeURIComponent(tel)+undo).catch(function(){});
  loadConvs();
  var m=document.getElementById('msgs');if(m&&!undo){m.style.display='none';document.getElementById('sugestao').style.display='none';document.getElementById('vazio').style.display='flex';}
}
function toggleArquivadas(){
  window._verArq=!window._verArq;
  var bc=document.getElementById('barra-arq');
  if(bc)bc.remove();
  if(window._verArq){
    var alvo=document.getElementById('lista-conv');
    if(alvo&&alvo.parentNode){
      var d=document.createElement('div');
      d.id='barra-arq';
      d.style.cssText='background:rgba(139,147,163,.1);border:1px solid #2a2f38;border-radius:9px;padding:8px 11px;margin:0 0 6px;font-size:11px;color:#c9ced6;';
      d.innerHTML='🗄 <b>Conversas arquivadas</b><div style="color:#5a6270;font-size:10px;margin-top:2px;">resolvidas ou sem resposta há 30+ dias · usa a busca acima para achar um cliente · se ele escrever, volta sozinha</div>';
      alvo.parentNode.insertBefore(d,alvo);
    }
  }
  document.getElementById('btn-ver-arq').style.color=window._verArq?'#fbbf24':'#5a6270';
  loadConvs();
}
function fmtTel(t){
  var d=String(t||'').replace(/\D/g,'');
  if(d.indexOf('55')===0)d=d.slice(2);
  if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return t;
}
function copiaTel(t){
  var d=String(t||'').replace(/\D/g,'');
  (navigator.clipboard?navigator.clipboard.writeText(d):Promise.reject()).then(function(){alert('Número copiado: '+d);}).catch(function(){prompt('Número do cliente:',d);});
}
function renderLista(d){
    var el=document.getElementById('lista-conv');
    var lst=d.conversas||[];
    var q=window._filtroConv||'';
    if(q)lst=lst.filter(function(c){return (c.nome||'').toLowerCase().indexOf(q)>-1||String(c.tel||'').indexOf(q.replace(/\D/g,''))>-1;});
    if(window._filtroOrc){
      // a lista passa a ser a DOS ORÇAMENTOS: mesmo quem não tem conversa recente aparece
      var abertos=((window._orcDados||{}).abertos)||[];
      var porD8={};
      (d.conversas||[]).forEach(function(c){porD8[String(c.tel||'').replace(/\D/g,'').slice(-8)]=c;});
      lst=abertos.map(function(a){
        var c=porD8[a.d8]||{};
        return Object.assign({}, c, {
          tel: c.tel||a.tel, nome: a.nome||c.nome,
          semConversa: !c.tel,
          equipamento: a.equipamento, horasParado: a.horasParado, sis: a.sis,
          ultimaMsg: c.ultimaMsg||('🕐 sem mensagem no histórico recente')
        });
      });
      if(q)lst=lst.filter(function(c){return (c.nome||'').toLowerCase().indexOf(q)>-1||String(c.tel||'').indexOf(q.replace(/\D/g,''))>-1;});
      if(!lst.length){el.innerHTML='<div style="padding:20px;color:#f59e0b;font-size:12px;text-align:center;">💰 Nenhum orçamento em aberto<br><span style="color:#5a6270;">(toca no cartão Orçamentos de novo pra limpar o filtro)</span></div>';return;}
    }
    if(!lst.length){el.innerHTML='<div style="padding:20px;color:#5a6270;font-size:12px;text-align:center;">Nenhuma conversa encontrada</div>';return;}
    el.innerHTML=lst.map(function(c){
      return '<div class="conv'+(c.tel===_tel?' sel':'')+(c.escalada?' conv-escalada':'')+'" onclick="abrirConversa(\''+c.tel+'\')">'
        +'<div class="conv-nome">'+esc(c.nome||fmtTel(c.tel))+(c.escalada?'<span class="conv-badge" style="background:rgba(245,158,11,.35);color:#fde047;">⚠️ precisa de humano</span>':'')+(c.pausado?'<span class="conv-badge" style="background:rgba(245,158,11,.25);color:#fbbf24;">✋ manual</span>':(c.naoRespondida?'<span class="conv-badge">responder</span>':''))+'</div>'
        +'<div style="font-size:10.5px;color:#5a8dc9;font-family:var(--fm,monospace);margin:1px 0 2px;">📞 '+fmtTel(c.tel)
          +(c.arquivadaEm?'<span style="color:#5a6270;"> · 🗄 '+new Date(c.arquivadaEm).toLocaleDateString('pt-BR')+'</span>':'')+'</div>'
        +(window._filtroOrc&&c.horasParado!=null
          ?'<div style="font-size:10px;color:'+(c.horasParado>24?'#fca5a5':'#8b93a3')+';margin-bottom:2px;">'
            +(c.equipamento?esc(c.equipamento)+' · ':'')
            +(c.horasParado<24?Math.round(c.horasParado)+'h':Math.floor(c.horasParado/24)+'d')+' aguardando'
            +(c.sis==='tv'?' · TV':'')+'</div>'
          :'')
        +'<div class="conv-ultima">'+esc(c.ultimaMsg)+'</div>'
      +'</div>';
    }).join('');
}

var _pausadoAtual=false;
function atualizarBtnTakeover(){
  var b=document.getElementById('btn-takeover');
  if(!b)return;
  if(_pausadoAtual){b.textContent='▶ Devolver ao bot';b.style.background='rgba(34,197,94,.14)';b.style.color='#4ade80';b.style.border='1px solid rgba(34,197,94,.4)';}
  else{b.textContent='✋ Assumir conversa';b.style.background='rgba(245,158,11,.14)';b.style.color='#fbbf24';b.style.border='1px solid rgba(245,158,11,.4)';}
}
async function toggleTakeover(){
  if(!_tel)return;
  var acao=_pausadoAtual?'retomar-bot':'pausar-bot';
  if(!_pausadoAtual&&!confirm('Assumir esta conversa? O bot fica em silêncio SÓ com este cliente (respostas, orçamentos e ações automáticas pausados) até você devolver.'))return;
  var r=await fetch('/api/wa-bot?action='+acao,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tel:_tel})}).then(function(x){return x.json();}).catch(function(){return{ok:false};});
  if(r.ok){_pausadoAtual=!_pausadoAtual;atualizarBtnTakeover();carregarConversas();}
}
async function conflitoResolvido(){
  if(!_tel)return;
  if(!confirm('Marcar o conflito desta conversa como resolvido?'))return;
  await fetch('/api/wa-bot?action=conflito-resolvido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tel:_tel})});
  alert('Conflito marcado como resolvido.');
  carregarConversas();
}
async function abrirConversa(tel){
  _tel=tel;
  try{
    var cc=((window._ultD||{}).conversas||[]).find(function(x){return x.tel===tel;});
    _pausadoAtual=!!(cc&&cc.pausado);atualizarBtnTakeover();
  }catch(e){}
  document.getElementById('vazio').style.display='none';
  document.getElementById('msgs').style.display='flex';
  document.getElementById('sugestao').style.display='block';
  var hdrT=document.getElementById('tel-atual');
  if(!hdrT){
    hdrT=document.createElement('div');hdrT.id='tel-atual';
    hdrT.style.cssText='padding:6px 12px;background:#101623;border-bottom:1px solid #1e2530;font-size:12.5px;color:#5a8dc9;font-family:monospace;cursor:pointer;';
    document.getElementById('msgs').parentNode.insertBefore(hdrT,document.getElementById('msgs'));
  }
  var ccN=((window._ultD||{}).conversas||[]).find(function(x){return x.tel===tel;});
  hdrT.innerHTML='<span onclick="copiaTel(\''+tel+'\')" style="cursor:pointer;">📞 <b>'+fmtTel(tel)+'</b>'+(ccN&&ccN.nome?' — '+esc(ccN.nome):'')+'</span>'+
    '<button onclick="mandarConflito(\''+tel+'\')" style="float:right;background:#7f1d1d;border:1px solid #b91c1c;border-radius:7px;padding:3px 10px;color:#fecaca;font-size:11px;cursor:pointer;margin-right:6px;">⚡ Conflitos Bot</button>'+
    '<button onclick="arquivarConv(\''+tel+'\')" style="float:right;background:#1e293b;border:1px solid #334155;border-radius:7px;padding:3px 10px;color:#94a3b8;font-size:11px;cursor:pointer;">🗄 '+(ccN&&ccN.arquivada?'Desarquivar':'Arquivar')+'</button>';
  carregarConversas();
  var box=document.getElementById('msgs');
  box.innerHTML='<div style="color:#5a6270;font-size:11px;text-align:center;">⏳</div>';
  try{
    var d=await fetch('/api/wa-bot?action=historico&tel='+encodeURIComponent(tel)).then(function(r){return r.json();});
    box.innerHTML=(d.msgs||[]).map(function(m){
      if(m.dir==='acao')return '<div class="msg acao">⚡ '+esc(ACAO_LBL[m.texto]||m.texto)+' · '+fdt(m.ts)+'</div>';
      return '<div class="msg '+(m.dir==='in'?'in':'out')+'">'+esc(m.texto)
        +'<div class="msg-ts">'+fdt(m.ts)+(m.via==='copiloto'?' · ✅ aprovada':'')+'</div></div>';
    }).join('')||'<div style="color:#5a6270;font-size:11px;text-align:center;">Sem mensagens</div>';
    box.scrollTop=box.scrollHeight;
    if(d.sugestao&&d.sugestao.resposta){preencherSugestao(d.sugestao);}
  }catch(e){box.innerHTML='<div style="color:#ef4444;font-size:11px;">Erro: '+e.message+'</div>';}
}

function preencherSugestao(s){
  document.getElementById('sug-texto').value=s.resposta||'';
  _acaoSug=(s.acao&&s.acao.tipo)||'nenhuma';
  var bx=document.getElementById('sug-acao-box');
  bx.innerHTML=_acaoSug!=='nenhuma'
    ?'<div class="sug-acao">⚡ Ação sugerida: '+esc(ACAO_LBL[_acaoSug]||_acaoSug)+' <span style="color:#5a6270;font-weight:600;">('+esc((s.acao&&s.acao.motivo)||'')+')</span></div>'
    :'';
}

async function gerarSugestao(){
  if(!_tel)return;
  var ta=document.getElementById('sug-texto');
  ta.value='🤖 Pensando...';
  try{
    var d=await fetch('/api/wa-bot?action=sugerir&tel='+encodeURIComponent(_tel)).then(function(r){return r.json();});
    if(d.ok&&d.sugestao){preencherSugestao(d.sugestao);}
    else{ta.value='';alert('Erro: '+(d.error||'falha'));}
  }catch(e){ta.value='';alert('Erro: '+e.message);}
}

async function aprovarEnviar(){
  if(!_tel)return;
  var texto=document.getElementById('sug-texto').value.trim();
  if(!texto){alert('Escreva ou gere a mensagem primeiro');return;}
  try{
    var d=await fetch('/api/wa-bot?action=enviar',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tel:_tel,texto:texto,acaoAprovada:_acaoSug})
    }).then(function(r){return r.json();});
    if(d.ok){
      document.getElementById('sug-texto').value='';_acaoSug='nenhuma';
      document.getElementById('sug-acao-box').innerHTML='';
      abrirConversa(_tel);
    }else alert('Erro no envio: '+(d.meta||d.error||'falha'));
  }catch(e){alert('Erro: '+e.message);}
}

carregarConversas();
setInterval(function(){ if(!document.hidden){ carregarConversas(); if(_tel)abrirConversa(_tel); } }, 30000);

var _kpiDias=parseInt(localStorage.getItem('bot_kpi_d')||'1');
// ── 📒 LOG DE ORÇAMENTOS ──────────────────────────────────────────────
let _logOrcAberto=false, _logOrcDias=7;
async function abrirLogOrc(dias){
  var el=document.getElementById('log-orc');
  if(_logOrcAberto&&dias===undefined){el.style.display='none';_logOrcAberto=false;return;}
  if(dias!==undefined)_logOrcDias=dias;
  _logOrcAberto=true; el.style.display='block';
  el.innerHTML='<div style="padding:14px;color:#5a6270;font-size:11.5px;">⏳ carregando…</div>';
  var r=await fetch('/api/wa-bot?action=log-orcamentos&dias='+_logOrcDias).then(function(x){return x.json();}).catch(function(){return null;});
  if(!r||!r.ok){el.innerHTML='<div style="padding:14px;color:#f87171;font-size:11.5px;">não consegui carregar</div>';return;}
  var R=r.RESUMO||{};
  function card(rot,val,cor){
    return '<div style="background:#12161d;border:1px solid #242b39;border-radius:10px;padding:9px 11px;">'
      +'<div style="font-family:ui-monospace,monospace;font-size:17px;font-weight:700;color:'+(cor||'#f0f2f5')+';">'+val+'</div>'
      +'<div style="font-size:9.5px;color:#5a6270;font-weight:700;margin-top:2px;">'+rot+'</div></div>';
  }
  function bloco(titulo,itens,cor,vazio){
    if(!itens||!itens.length)return '<div style="margin-top:10px;"><div style="font-size:11px;font-weight:900;color:'+cor+';margin-bottom:5px;">'+titulo+'</div>'
      +'<div style="font-size:11px;color:#5a6270;padding:6px 0;">'+(vazio||'nenhum')+'</div></div>';
    return '<div style="margin-top:10px;">'
      +'<div style="font-size:11px;font-weight:900;color:'+cor+';margin-bottom:5px;">'+titulo+' <span style="color:#5a6270;font-weight:400;">('+itens.length+')</span></div>'
      +'<div style="background:#0f1319;border:1px solid #1e2228;border-radius:9px;padding:9px 11px;max-height:220px;overflow-y:auto;'
      +'font-family:ui-monospace,monospace;font-size:10.5px;color:#c9ced6;line-height:1.75;">'
      +itens.map(function(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');}).join('<br>')+'</div></div>';
  }
  el.innerHTML='<div style="background:#0d1117;border:1px solid #242b39;border-radius:12px;padding:13px 14px;">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">'
      +'<span style="font-size:12px;font-weight:900;color:#25d366;">📒 LOG DE ORÇAMENTOS</span>'
      +'<span style="font-size:10.5px;color:#5a6270;">'+(r.periodo||'')+'</span>'
      +'<div style="margin-left:auto;display:flex;gap:4px;">'
        +[1,7,30].map(function(d){return '<button class="btn" onclick="abrirLogOrc('+d+')" style="font-size:10px;padding:3px 9px;'+(_logOrcDias===d?'background:#1d4ed8;color:#fff;':'')+'">'+(d===1?'Hoje':d+'d')+'</button>';}).join('')
      +'</div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;">'
      +card('ENVIADOS',R.orcamentosEnviados||0)
      +card('APROVADOS',R.aprovadosNoPeriodo||0,'#4ade80')
      +card('VALOR','R$ '+(R.valorAprovado||0),'#4ade80')
      +card('TAXA',R.taxaAprovacao||'—','#fbbf24')
      +card('NA JANELA 7D',R.naJanelaDe7Dias||0,'#60a5fa')
      +card('CONVERTERAM',R.converteramAposRecuperacao||0,'#4ade80')
      +card('ESGOTARAM 7',R.esgotaramAs7||0,(R.esgotaramAs7?'#f87171':'#5a6270'))
    +'</div>'
    +bloco('✅ APROVADOS NO PERÍODO',r.APROVADOS,'#4ade80','nenhuma aprovação registrada')
    +bloco('🔁 JANELA DE 7 DIAS',r.JANELA_7D,'#60a5fa','ninguém no ciclo de recuperação')
    +bloco('📤 ORÇAMENTOS ENVIADOS',r.ENVIADOS,'#8b93a3','nenhum envio no período')
  +'</div>';
}

function setPer(el){
  _kpiDias=parseInt(el.getAttribute('data-d'));
  localStorage.setItem('bot_kpi_d',String(_kpiDias));
  document.querySelectorAll('.kpi-per').forEach(function(b){b.style.background='';b.style.color='';});
  el.style.background='#22c55e';el.style.color='#111';
  loadKpis();
}
async function loadKpis(){
  if(window._orcVivos==null&&!window._orcCarregando){
    window._orcCarregando=true;
    carregarOrcVivos().then(function(){window._orcCarregando=false;loadKpis();});
  }
  try{
    var r=await fetch('/api/wa-bot?action=bot-stats&dias='+_kpiDias).then(function(x){return x.json();});

    if(!r.ok)return;
    var t=r.totais||{};
    var defs=[
      ['📨','Abordagens',t.abordagens||0,'#60a5fa'],
      ['🚚','P/ Logística',t.logistica||0,'#22c55e'],
      ['💰','Orçamentos',(window._orcVivos!=null?window._orcVivos:(t.orcamentos||0)),'#f59e0b'],
      ['✅','Aprovações',t.aprovacoes||0,'#4ade80'],
      ['🏪','Cliente Loja',t.cliente_loja||0,'#a78bfa'],
      ['📞','Entrar em Contato',t.entrar_contato||0,'#fb923c'],
      ['⚡','Conflitos Bot',t.conflitos||0,'#ef4444']
    ];
    document.getElementById('kpi-cards').innerHTML=defs.map(function(d){
      var clicavel=d[1]==='Orçamentos';
      var relatorio=d[1]==='Aprovações';
      var acao=clicavel?'onclick="toggleFiltroOrc()" ':(relatorio?'onclick="verAprovacoes()" ':'');
      return '<div '+acao+'style="background:#12161d;border:1px solid '+(clicavel&&window._filtroOrc?'#f59e0b':'#242b39')+';border-radius:10px;padding:10px 12px;'+(clicavel||relatorio?'cursor:pointer;':'')+'">'+
        '<div style="font-size:20px;font-weight:900;color:'+d[3]+';">'+d[2]+'</div>'+
        '<div style="font-size:10px;color:#8b93a3;font-weight:700;">'+d[0]+' '+d[1]
          +(clicavel?' <span style="color:#f59e0b;">'+(window._filtroOrc?'✕ filtro':'▸ filtrar')+'</span>':'')
          +(relatorio?' <span style="color:#4ade80;">▸ relatório</span>':'')+'</div></div>';
    }).join('');
  }catch(e){}
}
(function(){
  var btn=document.querySelector('.kpi-per[data-d="'+_kpiDias+'"]')||document.querySelector('.kpi-per');
  if(btn){btn.style.background='#22c55e';btn.style.color='#111';}
  loadKpis();
  setInterval(function(){if(!document.hidden)loadKpis();},120000);
})();
</script>
